<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture Orbital</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; color: #cfd8e6;
    font: 12px/1.6 ui-monospace, Menlo, monospace; background: rgba(0,0,0,0.45);
    padding: 10px 14px; border-radius: 6px; pointer-events: none;
  }
  #hud b { color: #fff; }
  #perf {
    position: fixed; right: 16px; top: 16px; color: #cfd8e6; width: 240px;
    font: 12px/1.6 ui-monospace, Menlo, monospace; background: rgba(0,0,0,0.45);
    padding: 10px 14px; border-radius: 6px;
  }
  #perf input { width: 100%; }
  .peer {
    position: fixed; left: 0; top: 0; color: #ffd59a; pointer-events: none; white-space: nowrap;
    font: 12px ui-monospace, Menlo, monospace; text-shadow: 0 0 3px #000;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"></div>
<div id="perf">
  <div id="fps">– fps</div>
  <div id="stats"></div>
  <label>LOD detail <span id="lodLabel"></span></label>
  <input id="lod" type="range" min="1" max="4" step="0.5" value="2">
</div>
<script type="module">
import * as THREE from 'three';

// Units are metres. Everything lives in the ring's frame; the Y axis is the ring axis and the floor is
// the inside of a cylinder at radius R. "Height" h is measured toward the axis, so a surface point sits
// at radius R - h. Sea level is h = 0. Across the ring, t = |u| / HW runs from 0 (centreline) to 1 (wall).
const R = 1e7;                          // 10,000 km
const C = 2 * Math.PI * R;              // circumference
const ROOTS = 26;                       // square root tiles around the ring
const TILE0 = C / ROOTS;                // root tile edge, ~2,417 km; also the ring width
const W = TILE0, HW = W / 2;
const WALL = 7e5;                       // 700 km walls
const BOWL_T = 0.8;                     // the floor curves up into the wall from here outward
const GRID = 32, MAX_LEVEL = 20, MAX_TILES = 8192;
const EYE = 1.7, GRAVITY = 9.81;
const DAY_RATE = 2 * Math.PI / 300;     // the shade turns once every 5 minutes

const clamp = THREE.MathUtils.clamp, smoothstep = THREE.MathUtils.smoothstep, lerp = THREE.MathUtils.lerp;
const wrapA = a => ((a % C) + C) % C;
const f1 = x => x.toFixed(1);           // JS number -> GLSL float literal

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // full Retina density costs ~40% more pixel work for little gain
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
// The camera never moves from the origin. Its true position is camPos (JS doubles), and the world is
// drawn relative to it, which keeps GPU numbers small near the viewer.
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1e8);
const camPos = new THREE.Vector3();

const stars = (() => {
  const n = 5000, p = new Float32Array(n * 3), v = new THREE.Vector3();
  for (let i = 0; i < n; i++) v.randomDirection().multiplyScalar(9e7).toArray(p, i * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false }));
})();
stars.renderOrder = -2;
scene.add(stars);

// Sky: a sphere around the camera, drawn just after the stars and before everything else, with no depth
// test. Each pixel runs the atmosphere along its view direction and blends the lit air over the stars.
const sky = new THREE.Mesh(new THREE.SphereGeometry(4e7, 32, 16), new THREE.ShaderMaterial({
  uniforms: null, side: THREE.BackSide, depthTest: false, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
}));
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);
scene.add(new THREE.AmbientLight(0x8899cc, 0.2));

// Sun, shade, hull and clouds use plain ring-frame coordinates, shifted by -camPos each frame. At 10^7 m
// that leaves about a metre of float error, which only shows if you press your face to the hull.
const farGroup = new THREE.Group();
scene.add(farGroup);

// --- Day and night ---
// A sun at the centre lights the whole floor straight down. A half-shell shade around it turns, and the
// half of the ring behind it is in night. There are no shadow maps: materials scale their direct light by
// dayFactor(azimuth), which matches what the shade blocks.
const dayUniforms = { uDayAngle: { value: 0 }, uLocalDay: { value: 1 }, uCamPos: { value: new THREE.Vector3() } };
const dayFactor = th => smoothstep(Math.cos(th - dayUniforms.uDayAngle.value), -0.06, 0.06);
const DAY_GLSL = /* glsl */`
uniform float uDayAngle;
uniform float uLocalDay;
varying float vDay;
float dayFactor(float th) { return smoothstep(-0.06, 0.06, cos(th - uDayAngle)); }

// --- Atmosphere ---
// Air sits between the walls with an 8 km scale height. For a ray from the camera to camera + rel, add up
// the air along it (optical depth) and how much of that air is sunlit. Samples cluster at both ends of
// the ray, where the air is: across the ring, the middle of a ray is in space.
uniform vec3 uCamPos;
const float ATM_H = 8000.0, ATM_BETA = 1.0 / 90000.0;   // optical depth 1 per 90 km of sea-level air
const vec3 ATM_EXT = vec3(0.55, 0.85, 1.6);             // blue scatters most
const vec3 ATM_SKY = vec3(0.30, 0.52, 1.0);             // colour of fully lit air
void atmosphere(vec3 rel, int n, out vec3 trans, out vec3 inscat) {
  float tau = 0.0, lit = 0.0;
  for (int k = 0; k < 16; k++) {
    if (k >= n) break;
    float x = (float(k) + 0.5) / float(n);
    float y = 2.0 * min(x, 1.0 - x), w = 4.0 * y * y * y;   // w = ds/dx
    float s = x < 0.5 ? 0.5 * y * y * y * y : 1.0 - 0.5 * y * y * y * y;
    vec3 p = uCamPos + rel * s;
    float alt = ${f1(R)} - length(p.xz);
    float dens = (abs(p.y) < ${f1(HW)} && alt > -4000.0) ? exp(-max(alt, 0.0) / ATM_H) : 0.0;
    tau += dens * w;
    lit += dens * w * dayFactor(atan(p.z, p.x));
  }
  float scale = length(rel) * ATM_BETA / float(n);
  tau *= scale; lit *= scale;
  trans = exp(-tau * ATM_EXT);
  inscat = ATM_SKY * (1.0 - trans) * (tau > 0.0 ? lit / tau : 0.0);
}`;
// mode 'tile': the tile code sets vDay. 'ring': from the ring-frame vertex position. 'local': one value
// for small things near the camera (ship, shrubs).
function patchDay(shader, mode) {
  Object.assign(shader.uniforms, dayUniforms);
  shader.vertexShader = DAY_GLSL + '\nvarying vec3 vAtmT;\nvarying vec3 vAtmI;\n' + shader.vertexShader;
  if (mode === 'ring') shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', /* glsl */`#include <begin_vertex>
    vec4 ringP = vec4(transformed, 1.0);
    #ifdef USE_INSTANCING
      ringP = instanceMatrix * ringP;
    #endif
    vDay = dayFactor(atan(ringP.z, ringP.x));
    atmosphere(ringP.xyz - uCamPos, 6, vAtmT, vAtmI);`);
  if (mode === 'local') shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvDay = uLocalDay;');
  shader.fragmentShader = 'varying float vDay;\n' + shader.fragmentShader.replace('#include <lights_fragment_end>',
    '#include <lights_fragment_end>\nreflectedLight.directDiffuse *= vDay;\nreflectedLight.directSpecular *= vDay;\ntotalEmissiveRadiance *= vDay;' +
    // Daytime sky light: the sun is always overhead, so without this every wall and cliff side is black.
    '\nreflectedLight.indirectDiffuse += diffuseColor.rgb * vec3(0.30, 0.38, 0.50) * vDay;');
  // Haze: things far away (through air) fade toward the sky colour. Ship and shrubs are too close to need it.
  if (mode !== 'local') shader.fragmentShader = 'varying vec3 vAtmT;\nvarying vec3 vAtmI;\n' + shader.fragmentShader.replace(
    '#include <tonemapping_fragment>', 'gl_FragColor.rgb = gl_FragColor.rgb * vAtmT + vAtmI;\n#include <tonemapping_fragment>');
}
const withDay = (mat, mode) => { mat.onBeforeCompile = s => patchDay(s, mode); return mat; };

sky.material.uniforms = dayUniforms;
sky.material.vertexShader = /* glsl */`
  varying vec3 vDir;
  void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
sky.material.fragmentShader = DAY_GLSL + /* glsl */`
  varying vec3 vDir;
  void main() {
    vec3 trans, inscat;
    atmosphere(normalize(vDir) * 2.5e7, 10, trans, inscat);   // long enough to cross the ring
    // Bright air hides the stars (the eye adapts to it); dark air on the night side leaves them visible.
    gl_FragColor = vec4(inscat, clamp(dot(inscat, vec3(0.333)) * 8.0, 0.0, 1.0));
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

const sunLight = new THREE.PointLight(0xfff4e0, 2.1, 0, 0); // no falloff: equal light everywhere
farGroup.add(sunLight);
farGroup.add(new THREE.Mesh(new THREE.SphereGeometry(8e4, 32, 16), new THREE.MeshBasicMaterial({ color: 0xfff2c0 })));
// Half sphere covering azimuths [-ρ, π - ρ] for rotation.y = ρ; rotated each frame to sit opposite the day side.
const shade = new THREE.Mesh(
  new THREE.SphereGeometry(1.2e5, 48, 24, 0, Math.PI),
  new THREE.MeshStandardMaterial({ color: 0x14161c, metalness: 0.8, roughness: 0.4, side: THREE.DoubleSide })
);
farGroup.add(shade);

// --- Terrain noise ---
// Gradient noise on an integer lattice over (arc length a, across u). Octave i has 32·2^i cells per
// root tile, so lattice coordinates are exact integers derived from tile indices on the GPU, and the
// lattice wraps cleanly around the ring. heightAt() in JS computes the same thing for the ship and walker.
const TERRAIN_VERT = /* glsl */`
attribute uvec3 aIdx;    // tile index along the ring, across the ring, level
attribute vec4 aCenter;  // tile centre minus camera (xyz), tile centre angle (w)
varying float vH;        // height
varying float vT;        // across-ring position, 0 centre to 1 wall
varying float vN;        // base noise, for vegetation patches
varying float vD;        // fine noise relative to the tile, for ragged colour-band edges
varying float vRiver;    // river noise: water where it's near zero
varying float vLake;     // lake noise: water where it's high
varying vec3 vUpV;       // local up in view space, for slope
varying float vFarm;     // farm-region noise
varying float vUrban;    // 1 inside a settlement, fading at its edge
varying float vFarmNear; // 1 within a few radii of a settlement
flat varying uvec2 vFieldBase;  // field lattice: integer origin for this tile...
varying vec2 vFieldLf;          // ...and position from it, in ~300 m field cells
uniform vec4 uTowns[64];        // nearest settlements: centre minus camera (xyz), radius (w)
uniform int uTownCount;

const vec2 GRADS[8] = vec2[8](vec2(1, 0), vec2(-1, 0), vec2(0, 1), vec2(0, -1),
  vec2(0.7071, 0.7071), vec2(-0.7071, 0.7071), vec2(0.7071, -0.7071), vec2(-0.7071, -0.7071));

uint tHash(uvec2 p, uint seed) {
  uint h = p.x * 1664525u + p.y * 1013904223u + seed * 2654435761u;
  h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; h *= 0x846ca68bu; h ^= h >> 16;
  return h;
}
float tGrad(uvec2 c, uint seed, vec2 f) { return dot(GRADS[int(tHash(c, seed) & 7u)], f); }
float tNoise(uvec2 c, vec2 f, uint wrapX, uint seed) {
  uint x1 = (c.x + 1u) % wrapX;
  vec2 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float n00 = tGrad(c, seed, f);
  float n10 = tGrad(uvec2(x1, c.y), seed, f - vec2(1, 0));
  float n01 = tGrad(uvec2(c.x, c.y + 1u), seed, f - vec2(0, 1));
  float n11 = tGrad(uvec2(x1, c.y + 1u), seed, f - vec2(1, 1));
  return mix(mix(n00, n10, w.x), mix(n01, n11, w.x), w.y);
}
// Position in octave i's lattice as an exact integer origin plus a small float offset.
// The tile origin in that lattice is idx.xy * 2^(5 + i - level). st is the position inside the tile, 0..1.
void latticeCoord(uvec3 idx, vec2 st, int i, out uvec2 base, out vec2 lf) {
  int shift = 5 + i - int(idx.z);
  if (shift >= 0) {
    base = idx.xy << uint(shift);
    lf = st * float(1 << shift);
  } else {
    uint rs = uint(-shift);
    base = idx.xy >> rs;
    lf = (vec2(idx.xy & ((1u << rs) - 1u)) + st) / float(1u << rs);
  }
}
// Octaves start..oct-1, the first at amplitude 1.
float tFbm(uvec3 idx, vec2 st, int start, int oct, uint seed) {
  float amp = 1.0, s = 0.0;
  for (int i = 0; i < 24; i++) {
    if (i >= oct) break;
    if (i < start) continue;
    uvec2 base; vec2 lf;
    latticeCoord(idx, st, i, base, lf);
    vec2 cf = floor(lf);
    uint wrapX = ${ROOTS * 32}u << uint(i);
    uvec2 c = uvec2((base.x + uint(cf.x)) % wrapX, base.y + uint(cf.y));
    s += amp * tNoise(c, lf - cf, wrapX, seed + uint(i));
    amp *= 0.5;
  }
  return s;
}
// Where the land strip ends, as t. A sum of whole-number sines so it repeats exactly once per lap.
float landEdge(float th) { return 0.31 + 0.07 * sin(3.0 * th + 1.3) + 0.05 * sin(7.0 * th + 0.4) + 0.03 * sin(17.0 * th + 2.1); }
// Each tile gets octaves down to about two of its vertex spacings, so detail appears as you approach.
float terrainHeight(uvec3 idx, vec2 st, float th, float u, out float n, out float river, out float lake) {
  int oct = int(idx.z) + 2;
  float t = abs(u) / ${f1(HW)};
  float le = landEdge(th);
  float land = 1.0 - smoothstep(le - 0.09, le + 0.09, t);
  n = tFbm(idx, st, 0, oct, 0u);
  float m = tFbm(idx, st, 0, min(oct, 12), 100u);
  river = abs(tFbm(idx, st, 0, min(oct, 6), 200u));
  lake = tFbm(idx, st, 0, min(oct, 5), 300u);
  // Sea floor with islands, which fade out before the bowl.
  float seaFloor = max(-1500.0 + n * 4500.0 * (1.0 - smoothstep(0.68, 0.78, t)), -3000.0);
  // Land: rolling ground plus ridged ranges up to ~8 km where the base noise is high. Rivers follow the
  // zero lines of their noise and lakes its high spots; both flatten the relief into a valley floor at
  // 150 m and cut a shallow bed for the water.
  float ridge = max(1.0 - abs(m), 0.0);
  float relief = abs(m) * 1200.0 + n * 500.0 + ridge * ridge * ridge * 8000.0 * smoothstep(-0.1, 0.4, n);
  float valley = min(smoothstep(0.0, 0.1, river), 1.0 - smoothstep(0.4, 0.55, lake));
  float landH = 150.0 + relief * valley - 10.0 * (1.0 - smoothstep(0.005, 0.012, river)) - 10.0 * smoothstep(0.55, 0.6, lake);
  // The floor curves up into the wall, steepening as it rises.
  float s = max(t - ${BOWL_T}, 0.0) / ${f1(1 - BOWL_T)};
  return mix(seaFloor, landH, land) + ${f1(WALL)} * s * s * s;
}`;

const GRADS = [[1, 0], [-1, 0], [0, 1], [0, -1], [0.7071, 0.7071], [-0.7071, 0.7071], [0.7071, -0.7071], [-0.7071, -0.7071]];
function tHash(x, y, seed) {
  let h = (Math.imul(x, 1664525) + Math.imul(y, 1013904223) + Math.imul(seed, 2654435761)) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x846ca68b) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}
function tGrad(x, y, seed, fx, fy) { const g = GRADS[tHash(x, y, seed) & 7]; return g[0] * fx + g[1] * fy; }
function tNoise(cx, cy, fx, fy, wrap, seed) {
  const x1 = (cx + 1) % wrap, fade = f => f * f * f * (f * (f * 6 - 15) + 10), wx = fade(fx), wy = fade(fy);
  const n00 = tGrad(cx, cy, seed, fx, fy), n10 = tGrad(x1, cy, seed, fx - 1, fy);
  const n01 = tGrad(cx, cy + 1, seed, fx, fy - 1), n11 = tGrad(x1, cy + 1, seed, fx - 1, fy - 1);
  return lerp(lerp(n00, n10, wx), lerp(n01, n11, wx), wy);
}
function tFbm(a, u, oct, seed) {
  let amp = 1, s = 0;
  for (let i = 0; i < oct; i++) {
    const cells = 32 * 2 ** i / TILE0, wrap = ROOTS * 32 * 2 ** i;
    const x = a * cells, y = (u + HW) * cells, cx = Math.floor(x), cy = Math.floor(y);
    s += amp * tNoise(cx % wrap, cy, x - cx, y - cy, wrap, seed + i);
    amp *= 0.5;
  }
  return s;
}
const landEdge = th => 0.31 + 0.07 * Math.sin(3 * th + 1.3) + 0.05 * Math.sin(7 * th + 0.4) + 0.03 * Math.sin(17 * th + 2.1);
const bowlH = u => WALL * (Math.max(Math.abs(u) / HW - BOWL_T, 0) / (1 - BOWL_T)) ** 3;
// Returns [height, wet]; wet is true on rivers and lakes.
function terrainAt(a, u) {
  const oct = MAX_LEVEL + 2, t = Math.abs(u) / HW, le = landEdge(a / R);
  const land = 1 - smoothstep(t, le - 0.09, le + 0.09);
  const n = tFbm(a, u, oct, 0), m = tFbm(a, u, Math.min(oct, 12), 100);
  const river = Math.abs(tFbm(a, u, Math.min(oct, 6), 200)), lake = tFbm(a, u, Math.min(oct, 5), 300);
  const seaFloor = Math.max(-1500 + n * 4500 * (1 - smoothstep(t, 0.68, 0.78)), -3000);
  const ridge = Math.max(1 - Math.abs(m), 0);
  const relief = Math.abs(m) * 1200 + n * 500 + ridge ** 3 * 8000 * smoothstep(n, -0.1, 0.4);
  const valley = Math.min(smoothstep(river, 0, 0.1), 1 - smoothstep(lake, 0.4, 0.55));
  const landH = 150 + relief * valley - 10 * (1 - smoothstep(river, 0.005, 0.012)) - 10 * smoothstep(lake, 0.55, 0.6);
  return [lerp(seaFloor, landH, land) + bowlH(u), land > 0.5 && (river < 0.0075 || lake > 0.57)];
}
const heightAt = (a, u) => terrainAt(a, u)[0];
// Cold rises toward the walls; colour and vegetation treat cold ground as if it were higher.
const coldAt = u => smoothstep(Math.abs(u) / HW, 0.35, 0.78);

// --- Terrain and water materials ---
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const PALETTE = {
  uSeabed: srgb(0.5, 0.47, 0.36), uSand: srgb(0.86, 0.79, 0.56), uGrass: srgb(0.36, 0.58, 0.22),
  uForest: srgb(0.14, 0.33, 0.13), uTundra: srgb(0.47, 0.44, 0.33), uRock: srgb(0.46, 0.43, 0.39),
  uSnow: srgb(0.95, 0.96, 0.98), uIce: srgb(0.82, 0.88, 0.93), uRiver: srgb(0.12, 0.33, 0.45),
};

// Both materials draw the same tiles. Water skips the noise and sits at h = 0.
// flatShading makes three derive normals from screen-space derivatives, so no neighbour heights are needed.
function patchTiles(shader) {
  patchDay(shader, 'tile');
  for (const [k, v] of Object.entries(PALETTE)) shader.uniforms[k] = { value: v };
  Object.assign(shader.uniforms, townUniforms);
  // Positions are built relative to the tile centre: with D the angle from the centre, the offset
  // along the outward radius is -R·(1 - cos D) - h·cos(D) and along the tangent (R - h)·sin(D).
  // Both stay accurate in float32, unlike subtracting two 10^7 m positions.
  // Skirt vertices (position.z = 1) drop below the surface to hide cracks between levels.
  shader.vertexShader = TERRAIN_VERT + '\n' + shader.vertexShader.replace('#include <begin_vertex>', /* glsl */`
    float size = ${f1(TILE0)} / float(1u << aIdx.z);
    float da = (position.x - 0.5) * size, du = (position.y - 0.5) * size;
    // Taylor series instead of sin/cos: GPU trig has a fixed absolute error (~1e-6), which times
    // R = 10^7 m is metres of jitter. D is at most ~0.12 (half a root tile), so these terms are plenty.
    float D = da / ${f1(R)}, D2 = D * D;
    float sinD = D * (1.0 - D2 / 6.0 * (1.0 - D2 / 20.0));
    float omc = 0.5 * D2 * (1.0 - D2 / 12.0 * (1.0 - D2 / 30.0));   // 1 - cos(D)
    float tTheta = aCenter.w + D;
    float tU = -${f1(HW)} + (float(aIdx.y) + position.y) * size;
    float tN = 0.0, tR = 1.0, tL = 0.0;
    #ifdef WATER
      float h = 0.0;   // flat, so no skirt: it would show through the transparent water
      vD = 0.0;
    #else
      float h = terrainHeight(aIdx, position.xy, tTheta, tU, tN, tR, tL) - position.z * size * 0.05;
      vD = tFbm(aIdx, position.xy, max(int(aIdx.z) - 3, 0), int(aIdx.z) + 2, 400u);
      vFarm = tFbm(aIdx, position.xy, 0, min(int(aIdx.z) + 2, 4), 500u);
      latticeCoord(aIdx, position.xy, 8, vFieldBase, vFieldLf);   // octave 8: 295 m cells
    #endif
    vH = h; vT = abs(tU) / ${f1(HW)}; vN = tN; vRiver = tR; vLake = tL;
    vDay = dayFactor(tTheta);
    float outward = -${f1(R)} * omc - h * (1.0 - omc);
    float along = ${f1(R)} * sinD - h * sinD;
    vec3 er = vec3(cos(aCenter.w), 0.0, sin(aCenter.w)), et = vec3(-er.z, 0.0, er.x);
    vec3 transformed = aCenter.xyz + er * outward + et * along + vec3(0.0, du, 0.0);
    vUpV = (viewMatrix * vec4(-er, 0.0)).xyz;
    #ifdef DECK
      // GSV deck: the same tile laid flat in the plane through its centre (er, et are the GSV's axes,
      // since aCenter.w is its angle). Heights shrink to DECK_SCALE and flatten toward the deck's edge;
      // colours use heights squeezed to 0.3 above the 150 m lowland, so only top ridges reach snow. lx, ly: from the deck centre.
      float dk = float(1u << (aIdx.z - 8u));
      float lx = (float(aIdx.x) - ${DECK_K0}.0 * dk + position.x) * size - ${f1(DECK_L / 2)};
      float ly = (float(aIdx.y) - ${DECK_KU}.0 * dk + position.y) * size - ${f1(DECK_W / 2)};

// --- Quadtree tiles ---

function updateTiles() {
  projM.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

  camA = wrapA(Math.atan2(camPos.z, camPos.x) * R);

function visit(ka, ku, level) {
  const size = TILE0 / 2 ** level;
  const ac = (ka + 0.5) * size, uc = -HW + (ku + 0.5) * size, th = ac / R;
  const cx = R * Math.cos(th) - camPos.x, cy = uc - camPos.y, cz = R * Math.sin(th) - camPos.z;
  sphere.center.set(cx, cy, cz);
  sphere.radius = 0.75 * size + 9000 + bowlH(Math.abs(uc) + size / 2);
  if (!frustum.intersectsSphere(sphere)) return;

  // camera's, held within the band the terrain can occupy there, so standing on a mountain still refines.
  let d = camA - ac;
  d -= Math.round(d / C) * C;

  const dist = Math.hypot(camPos.x - pr * Math.cos(an), camPos.y - un, camPos.z - pr * Math.sin(an));

    new THREE.IcosahedronGeometry(1, 1),
    // Smooth shading, a faint glow so undersides stay light grey, and no depth writes so puffs don't cut into each other.

  const yAxis = new THREE.Vector3(0, 1, 0), inward = new THREE.Vector3();
  let n = 0;
  for (let i = 0; i < CLOUDS; i++) {
    const theta = Math.random() * Math.PI * 2, u = (Math.random() * 2 - 1) * HW * 0.7;
    const alt = 2000 + Math.random() * 3000;
    for (let k = 0; k < PUFFS; k++) {
      const th = theta + (Math.random() - 0.5) * 3e4 / R, uu = u + (Math.random() - 0.5) * 3e4, r = R - alt - Math.random() * 500;
      inward.set(-Math.cos(th), 0, -Math.sin(th));

      s.set(8e3 + Math.random() * 15e3, 600 + Math.random() * 600, 6e3 + Math.random() * 12e3);
      mesh.setMatrixAt(n++, m.compose(v, q, s));

const ringPoint = (a, u, h, out) => out.set((R - h) * Math.cos(a / R), u, (R - h) * Math.sin(a / R));

// --- Settlements ---

  { cell: 4e4, chance: 0.5, rMin: 700, rMax: 1800, range: 1.5e5, seed: 901 }, // towns

  for (let k = 0; k < 4 && !s && (tHash(ci, cj, T.seed) & 1023) / 1024 < T.chance; k++) {

    const r = T.rMin + (T.rMax - T.rMin) * ((h >>> 4) & 63) / 63;

    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {

      if (s && Math.hypot(arcDelta(s.a, a), s.u - u) < R0 + s.r) out.push(s);

const tmpV = new THREE.Vector3();

function makeBuildingChunk(ia, iu) {
  const a0 = ia * BCHUNK, u0 = iu * BCHUNK, list = [];
  const towns = settlementsNear(a0 + BCHUNK / 2, u0 + BCHUNK / 2, BCHUNK);
  for (const s of towns) {
    const B = BUILD[s.tier], sp = B.spacing;
    for (let a = Math.ceil(a0 / sp) * sp; a < a0 + BCHUNK; a += sp) for (let u = Math.ceil(u0 / sp) * sp; u < u0 + BCHUNK; u += sp) {
      const q = Math.hypot(arcDelta(a, s.a), u - s.u) / s.r;
      if (q > 1) continue;
      const hsh = tHash(Math.round(a / sp), Math.round(u / sp) + 1e6, 1000 + s.tier);
      const k1 = (hsh & 1023) / 1023, k2 = ((hsh >>> 10) & 1023) / 1023, k3 = ((hsh >>> 20) & 1023) / 1023;
      if (k1 > B.density * (1 - q * q)) continue;
      const [g, wet] = terrainAt(a, u);
      if (wet || g < 5) continue;
      const height = s.tier === 0 ? 12 + 300 * (1 - q) ** 3 * k2 * k2 : s.tier === 1 ? 6 + 25 * (1 - q) ** 2 * k2 : 4 + 6 * k2;
      const fp = B.fp[0] + (B.fp[1] - B.fp[0]) * k3;
      list.push({ a, u, g, w: fp, d: fp * (0.6 + 0.4 * k2), height, shade: 0.75 + 0.4 * k3, color: B.color });
    }
  }
  return list;
}

function updateBuildings() {

  const near = R - camR - Math.max(heightAt(a, u), 0) < BUILD_ALT;
  const ca = Math.floor(a / BCHUNK), cu = Math.floor(u / BCHUNK);
  for (const [key, c] of bChunks) {
    let d = c.ia - ca; d -= Math.round(d / NBCHUNK_A) * NBCHUNK_A;
    if (!near || Math.abs(d) > BRADIUS + 1 || Math.abs(c.iu - cu) > BRADIUS + 1) { bChunks.delete(key); bDirty = true; }
  }
  if (near) {
    let budget = 2;
    for (let r = 0; r <= BRADIUS && budget > 0; r++) {
      for (let i = -r; i <= r && budget > 0; i++) for (let j = -r; j <= r && budget > 0; j++) {
        if (Math.max(Math.abs(i), Math.abs(j)) !== r) continue;
        const ia = ((ca + i) % NBCHUNK_A + NBCHUNK_A) % NBCHUNK_A, iu = cu + j, key = ia + ',' + iu;
        if (bChunks.has(key)) continue;
        const list = makeBuildingChunk(ia, iu);
        bChunks.set(key, { ia, iu, list });
        if (list.length) { bDirty = true; budget--; }

}

function updateShip(dt) {

  if (keys.has('KeyS')) shipSpeed = shipSpeed < 1 ? 0 : shipSpeed * Math.exp(-2.5 * dt);

  // A/D roll. Without roll input, the wings drift back to level with the local floor.
  const roll = (keys.has('KeyA') ? 1 : 0) - (keys.has('KeyD') ? 1 : 0);
  if (roll) shipQ.multiply(dq.setFromAxisAngle(Z, roll * 1.5 * dt));
  else {
    const r = Math.hypot(shipPos.x, shipPos.z);
    up.set(-shipPos.x / r, 0, -shipPos.z / r);
    right.copy(X).applyQuaternion(shipQ);
    shipQ.multiply(dq.setFromAxisAngle(Z, -right.dot(up) * 1.5 * dt));
  }
  shipQ.normalize();

  fwd.set(0, 0, -1).applyQuaternion(shipQ);
  shipPos.addScaledVector(fwd, shipSpeed * dt);

  // Keep above the ground or water while over the floor.
  const r = Math.hypot(shipPos.x, shipPos.z);
  if (r < R + 1000 && Math.abs(shipPos.y) < HW) {
    const a = wrapA(Math.atan2(shipPos.z, shipPos.x) * R);
    const minR = R - Math.max(heightAt(a, shipPos.y), 0) - CLEARANCE;
    if (r > minR) { shipPos.x *= minR / r; shipPos.z *= minR / r; }
  }
  // And above the GSV deck.
  const dk = deckLocal(shipPos);
  if (dk.on) {
    const g = deckH(dk.x, dk.y) + CLEARANCE;
    if (dk.h < g) shipPos.addScaledVector(GSV_UP, g - dk.h);
  }

  // Chase camera: lags the ship's turns a little, then sits behind and above it.
  camQ.slerp(shipQ, 1 - Math.exp(-6 * dt));
  camPos.copy(CHASE).applyQuaternion(camQ).add(shipPos);
  camera.quaternion.copy(camQ);
}

  } else {
    player.a = wrapA(player.a + stepA);
    player.u = clamp(player.u + stepU, -HW + 10, HW - 10);
  }

  // Jump launch speed equals walk speed, so scrolling up gives bigger leaps.
  if (keys.has('Space') && player.z === 0) player.vz = walkSpeed;
  player.vz -= GRAVITY * dt;
  player.z = Math.max(0, player.z + player.vz * dt);
  if (player.z === 0) player.vz = Math.max(0, player.vz);

  if (player.deck) {
    deckPoint(player.a, player.u, deckH(player.a, player.u) + EYE + player.z, camPos);
  } else {
    const ground = Math.max(heightAt(player.a, player.u), 0); // walk on the water surface
    ringPoint(player.a, player.u, ground + EYE + player.z, camPos);
  }
  const th = player.deck ? GSV_A / R : player.a / R;

  up.set(-Math.cos(th), 0, -Math.sin(th));
  east.set(-Math.sin(th), 0, Math.cos(th));
  fwd.copy(east).multiplyScalar(cy);
  fwd.y = sy;
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  fwdP.copy(fwd).multiplyScalar(cp).addScaledVector(up, sp);
  upP.copy(up).multiplyScalar(cp).addScaledVector(fwd, -sp);
  right.crossVectors(fwdP, upP);
  basis.makeBasis(right, upP, fwdP.negate());
  camera.quaternion.setFromRotationMatrix(basis);
}

renderer.domElement.addEventListener('click', () => { renderer.domElement.requestPointerLock(); startAudio(); });
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  if (mode === 'walk') {
    player.yaw -= e.movementX * 0.002;
    player.pitch = clamp(player.pitch - e.movementY * 0.002, -1.5, 1.5);
  } else {
    // Mouse turns the ship about its own axes: right/left is yaw, up/down is pitch.
    shipQ.multiply(dq.setFromAxisAngle(up.set(0, 1, 0), -e.movementX * 0.002));
    shipQ.multiply(dq.setFromAxisAngle(X, -e.movementY * 0.002));
  }
});
addEventListener('keydown', e => {
  keys.add(e.code);
  if (e.code === 'KeyV') mode === 'walk' ? toShip() : toWalk();
  if (e.code === 'KeyO') overview();
  if (e.code === 'KeyH') spawn();
  if (e.code === 'KeyJ' && peers.size) goTo(peers.values().next().value);
  if (e.code === 'KeyG' && gsvOn) goToGsv();
  if (e.code === 'KeyX') toggleGsv();
  if (e.code === 'KeyM') { muted = !muted; updateHud(); }
  if (e.code === 'KeyP') { spinning = !spinning; updateHud(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('wheel', e => {
  const k = e.deltaY < 0 ? 1.25 : 1 / 1.25;
  if (mode === 'walk') { walkSpeed = clamp(walkSpeed * k, 0.5, 1e5); updateHud(); }
  else shipSpeed = clamp(Math.max(shipSpeed, 4) * k, 0, SHIP_MAX);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hud = document.getElementById('hud');
const fmtSpeed = v => { const mph = v * 2.23694; return `${mph < 100 ? mph.toFixed(1) : Math.round(mph).toLocaleString()} mph`; };
function updateHud() {
  const top = mode === 'walk'
    ? `<b>WALK</b> &nbsp; <b>Click</b> look (Esc releases) &nbsp; <b>WASD</b> walk &nbsp; <b>Space</b> jump (scales with speed)<br>` +
      `<b>Scroll</b> speed (${fmtSpeed(walkSpeed)}) &nbsp; `
    : `<b>SHIP</b> &nbsp; <b>Click</b> steer with mouse (Esc releases) &nbsp; <b>W/S</b> throttle &nbsp; <b>A/D</b> roll<br>` +
      `<b>Scroll</b> throttle &nbsp; `;
  hud.innerHTML = top + `<b>V</b> walk/ship &nbsp; <b>O</b> overview &nbsp; <b>H</b> respawn &nbsp; <b>J</b> join other player &nbsp; <b>G</b> go to GSV &nbsp; <b>X</b> GSV ${gsvOn ? 'on' : 'off'} &nbsp; <b>P</b> day cycle ${spinning ? 'on' : 'off'} &nbsp; <b>M</b> sound ${muted ? 'off' : 'on'}`;
}
spawn();

// --- Contrails ---
// A line from each wingtip. Points are kept in ring-frame doubles and rewritten relative to the camera
// every frame. A new point is laid every 50 ms and the newest one follows the wingtip; older points fade.
const TRAIL_N = 60, TIPS = [new THREE.Vector3(-5, 0, 2.5), new THREE.Vector3(5, 0, 2.5)];
const trailMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false });
const tipV = new THREE.Vector3();
function makeTrail() {
  const lines = TIPS.map(() => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    const c = new Float32Array(TRAIL_N * 4);
    for (let i = 0; i < TRAIL_N; i++) c.set([1, 1, 1, 0.6 * i / (TRAIL_N - 1)], i * 4);  // newest is last
    g.setAttribute('color', new THREE.BufferAttribute(c, 4));
    const line = new THREE.Line(g, trailMat);
    line.frustumCulled = false;
    scene.add(line);
    return line;
  });
  return { lines, pts: TIPS.map(() => []), t: 0 };
}
function updateTrail(tr, pos, q) {
  const now = performance.now(), lay = now - tr.t > 50;
  if (lay) tr.t = now;
  tr.lines.forEach((line, k) => {
    const pts = tr.pts[k];
    tipV.copy(TIPS[k]).applyQuaternion(q).add(pos);
    if (lay || !pts.length) { pts.push(tipV.clone()); if (pts.length > TRAIL_N) pts.shift(); }
    else pts[pts.length - 1].copy(tipV);
    // Fill the end of the buffer, so the fade always ends at the newest point.
    const arr = line.geometry.attributes.position.array, s = TRAIL_N - pts.length;
    pts.forEach((p, i) => arr.set([p.x - camPos.x, p.y - camPos.y, p.z - camPos.z], (s + i) * 3));
    line.geometry.attributes.position.needsUpdate = true;
    line.geometry.setDrawRange(s, pts.length);
  });
}
const myTrail = makeTrail();

// --- Speed feel ---
// Felt speed f runs 0..1 on a log scale from 50 m/s to SHIP_MAX. It widens the field of view,
// stretches the engine glow, and fades in streaks of dust that stream past the ship.
// Dust lives in ship-local coordinates (forward is -Z) and drifts backward at the ship's speed,
// capped so the streaks stay readable; each streak is a line from bright head to clear tail.
const DUST_N = 400, DUST_NEAR = 50, DUST_FAR = 300;
const dust = new Float32Array(DUST_N * 3);
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUST_N * 6), 3));
{
  const c = new Float32Array(DUST_N * 8);
  for (let i = 0; i < DUST_N; i++) c.set([0.85, 0.92, 1, 1, 0.85, 0.92, 1, 0], i * 8);
  dustGeo.setAttribute('color', new THREE.BufferAttribute(c, 4));
}
const dustMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, opacity: 0 });
const dustLines = new THREE.LineSegments(dustGeo, dustMat);
dustLines.frustumCulled = false;
scene.add(dustLines);
// Place a mote off the flight line (15-150 m out), so none passes through the ship.
const seedDust = (i, z) => {
  const ang = Math.random() * Math.PI * 2, rad = 15 + 135 * Math.sqrt(Math.random());
  dust.set([rad * Math.cos(ang), rad * Math.sin(ang), z], i * 3);
};
for (let i = 0; i < DUST_N; i++) seedDust(i, DUST_NEAR - Math.random() * (DUST_NEAR + DUST_FAR));

const shipGlow = ship.getObjectByName('glow'), dv = new THREE.Vector3();
let felt = 0;
function updateSpeedFx(dt) {
  const target = mode === 'ship' ? clamp(Math.log(shipSpeed / 50) / Math.log(SHIP_MAX / 50), 0, 1) : 0;
  felt += (target - felt) * (1 - Math.exp(-4 * dt));

  camera.fov = 60 + 25 * felt;
  camera.updateProjectionMatrix();
  shipGlow.scale.set(1 + 0.4 * felt, 1 + 0.4 * felt, 1 + 5 * felt);
  shipGlow.position.z = 6.1 + 2 * felt;

  dustMat.opacity = 0.7 * felt;
  dustLines.visible = felt > 0.01;
  if (!dustLines.visible) return;
  const flow = Math.min(shipSpeed, 2000), len = 1 + 60 * felt;
  const arr = dustGeo.attributes.position.array, base = dv.copy(shipPos).sub(camPos);
  for (let i = 0; i < DUST_N; i++) {
    let z = dust[i * 3 + 2] + flow * dt;
    if (z > DUST_NEAR) { seedDust(i, z - DUST_NEAR - DUST_FAR); z = dust[i * 3 + 2]; }
    dust[i * 3 + 2] = z;
    const x = dust[i * 3], y = dust[i * 3 + 1];
    tipV.set(x, y, z).applyQuaternion(shipQ).add(base);
    arr.set([tipV.x, tipV.y, tipV.z], i * 6);
    tipV.set(x, y, z - len).applyQuaternion(shipQ).add(base);
    arr.set([tipV.x, tipV.y, tipV.z], i * 6 + 3);
  }
  dustGeo.attributes.position.needsUpdate = true;
}

// --- Sound ---
// Starts on the first click (browsers need a gesture). The engine is two detuned saws through a
// low-pass, pitched and opened up by felt speed. Wind is looped noise through a band-pass, loud only
// in thick air at speed: air density uses the same 8 km scale height as the atmosphere shader.
// M mutes.
let audio = null;
function startAudio() {
  if (audio) return;
  const ctx = new AudioContext(), out = ctx.createGain();
  out.connect(ctx.destination);
  const engine = ctx.createGain(), lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.connect(engine).connect(out);
  const oscs = [0, 7].map(cents => {
    const o = ctx.createOscillator();
    o.type = 'sawtooth'; o.detune.value = cents; o.connect(lp); o.start();
    return o;
  });
  const noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), wind = ctx.createGain();
  src.buffer = noise; src.loop = true;
  bp.type = 'bandpass'; bp.Q.value = 0.7;
  src.connect(bp).connect(wind).connect(out);
  src.start();
  audio = { ctx, out, engine, lp, oscs, bp, wind };
}
function updateAudio() {
  if (!audio) return;
  const t = audio.ctx.currentTime, k = 0.1;  // smoothing time constant, s
  const p = mode === 'walk' ? camPos : shipPos;
  const alt = R - Math.hypot(p.x, p.z), dens = Math.abs(p.y) < HW && alt > -4000 ? Math.exp(-Math.max(alt, 0) / 8000) : 0;
  const air = mode === 'ship' ? dens * Math.min(shipSpeed / 300, 1) : 0;
  audio.out.gain.setTargetAtTime(muted ? 0 : 1, t, k);
  audio.engine.gain.setTargetAtTime(mode === 'ship' ? 0.03 + 0.05 * felt : 0, t, k);
  audio.oscs.forEach(o => o.frequency.setTargetAtTime(45 + 110 * felt, t, k));
  audio.lp.frequency.setTargetAtTime(200 + 1800 * felt, t, k);
  audio.wind.gain.setTargetAtTime(0.25 * air, t, k);
  audio.bp.frequency.setTargetAtTime(300 + 1700 * felt, t, k);
}

// --- Multiplayer ---
// server.js relays poses between clients. Terrain is deterministic, so each client sends only its ship
// pose, plus its eye position while walking, 15 times a second. Remote players are drawn 100 ms in the
// past, between the two snapshots around that time. The day angle comes from the server's start time.
// Without server.js (e.g. python http.server) the socket just fails and the page runs single-player.
// Opened as a file there is no host to connect to, so a stand-in that never opens takes the socket's place.
const peers = new Map();  // id -> { name, snaps: [{ t, s, w }], ship, body, label }
const walkerGeo = new THREE.CapsuleGeometry(0.3, 1.2, 4, 8);
const walkerMat = withDay(new THREE.MeshStandardMaterial({ color: 0xff9f43, roughness: 0.6 }), 'local');
const myName = new URLSearchParams(location.search).get('name') || 'pilot';
const Y = new THREE.Vector3(0, 1, 0), pv = new THREE.Vector3(), pUp = new THREE.Vector3();
let epoch = null, seekPeer = false;

const ws = location.host ? new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`) : { readyState: WebSocket.CLOSED };
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === 'hello') {
    epoch = m.epoch;
    dayUniforms.uDayAngle.value = DAY_RATE * (Date.now() - epoch) / 1000;
    seekPeer = m.others > 0;  // someone is already here: spawn next to them once their pose arrives
    if (!seekPeer) spawn();
  } else if (m.type === 'leave') {
    const p = peers.get(m.id);
    if (p) { scene.remove(p.ship, p.body, ...p.trail.lines); p.label.remove(); peers.delete(m.id); }
  } else if (m.type === 'pose') {
    let p = peers.get(m.id);
    if (!p) {
      p = { snaps: [], ship: ship.clone(), body: new THREE.Mesh(walkerGeo, walkerMat), label: document.createElement('div'), trail: makeTrail() };
      p.ship.getObjectByName('glow').scale.set(1, 1, 1);  // clone copies our current glow stretch
      p.ship.getObjectByName('glow').position.z = 6.1;
      p.label.className = 'peer';
      document.body.append(p.label);
      scene.add(p.ship, p.body);
      peers.set(m.id, p);
    }
    p.name = m.name;
    p.snaps.push({ t: performance.now(), s: m.s, w: m.w });
    if (p.snaps.length > 10) p.snaps.shift();
    if (seekPeer) { seekPeer = false; goTo(p); }
  }
};
setInterval(() => {
  if (ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'pose', name: myName, s: [...shipPos.toArray(), ...shipQ.toArray()], w: mode === 'walk' ? camPos.toArray() : null }));
}, 66);

function goTo(p) {
  const { s, w } = p.snaps[p.snaps.length - 1];
  if (w) {  // on foot: bring the ship down beside them, on the ring or the GSV deck
    const dk = deckLocal(pv.fromArray(w));
    player.deck = dk.on;
    player.a = dk.on ? dk.x : wrapA(Math.atan2(w[2], w[0]) * R);
    player.u = dk.on ? dk.y : clamp(w[1], -HW + 10, HW - 10);
    player.yaw = 0;
    toShip();
  } else {  // flying: sit 60 m behind their ship, stopped
    shipQ.set(s[3], s[4], s[5], s[6]);
    shipPos.set(0, 10, 60).applyQuaternion(shipQ).add(pv.set(s[0], s[1], s[2]));
    camQ.copy(shipQ);
    shipSpeed = 0;
    mode = 'ship';
    updateHud();
  }
}

const lerp3 = (a, b, k, out) => out.set(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k));
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
function updatePeers() {
  const t = performance.now() - 100;
  for (const p of peers.values()) {
    const sn = p.snaps;
    let b = sn.findIndex(x => x.t > t);
    if (b === -1) b = sn.length - 1;  // nothing newer yet: hold the newest
    const A = sn[Math.max(b - 1, 0)], B = sn[b];
    const k = B.t > A.t ? clamp((t - A.t) / (B.t - A.t), 0, 1) : 1;

    p.ship.position.copy(lerp3(A.s, B.s, k, pv)).sub(camPos);
    p.ship.quaternion.slerpQuaternions(qa.fromArray(A.s, 3), qb.fromArray(B.s, 3), k);
    updateTrail(p.trail, lerp3(A.s, B.s, k, pv), p.ship.quaternion);

    p.body.visible = !!B.w;
    if (B.w) {
      lerp3(A.w || B.w, B.w, k, pv);  // eye position; the capsule's centre sits 0.8 m below it
      const r = Math.hypot(pv.x, pv.z);
      pUp.set(-pv.x / r, 0, -pv.z / r);
      p.body.position.copy(pv).addScaledVector(pUp, -0.8).sub(camPos);
      p.body.quaternion.setFromUnitVectors(Y, pUp);
    }

    placeLabel(p.label, (B.w ? p.body : p.ship).position, p.name);
  }
}

const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps'), statsEl = document.getElementById('stats');
let frames = 0, fpsT = performance.now();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (spinning) dayUniforms.uDayAngle.value = epoch === null
    ? dayUniforms.uDayAngle.value + DAY_RATE * dt
    : DAY_RATE * (Date.now() - epoch) / 1000;  // shared clock, so everyone sees the same day
  const dayAngle = dayUniforms.uDayAngle.value;
  shade.rotation.y = -dayAngle - Math.PI / 2;   // covers azimuths dayAngle + 90°..270°, the night side
  stars.rotation.y = -dayAngle;

  if (mode === 'walk') updateWalk(dt);
  else updateShip(dt);
  dayUniforms.uLocalDay.value = dayFactor(Math.atan2(camPos.z, camPos.x));
  dayUniforms.uCamPos.value.copy(camPos);
  ship.position.copy(shipPos).sub(camPos);
  ship.quaternion.copy(shipQ);
  updateTrail(myTrail, shipPos, shipQ);
  updateSpeedFx(dt);
  updateAudio();
  camera.updateMatrixWorld();
  updatePeers();
  farGroup.position.copy(camPos).negate();
  camera.updateMatrixWorld();
  updateTiles();
  updateGsv();
  updateTowns();
  updateShrubs();
  updateBuildings();
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - fpsT >= 500) {
    fpsEl.textContent = `${Math.round(frames * 1000 / (now - fpsT))} fps · ${(renderer.info.render.triangles / 1e6).toFixed(2)}M tris drawn`;
    const p = mode === 'walk' ? camPos : shipPos, alt = R - Math.hypot(p.x, p.z);
    statsEl.innerHTML = `${tileCount} tiles${deckCount ? ` + ${deckCount} deck` : ''}, deepest level ${deepest}<br>` +
      `finest spacing ${(TILE0 / 2 ** deepest / GRID).toFixed(3)} m<br>` +
      `altitude ${alt < 1e4 ? alt.toFixed(1) + ' m' : (alt / 1000).toFixed(0) + ' km'}` +
      (mode === 'ship' ? `<br>speed ${fmtSpeed(shipSpeed)}` : '') + `<br>${shrubMesh.count} shrubs, ${buildingMesh.count} buildings, ${nearTowns.length} settlements near`;
    frames = 0; fpsT = now;
  }
});
</script>
</body>
</html>
