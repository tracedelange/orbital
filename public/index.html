<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture Orbital</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; color: #cfd8e6;
    font: 12px/1.6 ui-monospace, Menlo, monospace; background: rgba(0,0,0,0.45);
    padding: 10px 14px; border-radius: 6px; pointer-events: none;
  }
  #hud b { color: #fff; }
  #perf {
    position: fixed; right: 16px; top: 16px; color: #cfd8e6; text-align: right;
    font: 12px/1.6 ui-monospace, Menlo, monospace;
  }
  #flight { display: inline-block; vertical-align: top; background: rgba(0,0,0,0.45); padding: 6px 12px; border-radius: 6px; }
  #flight b { color: #fff; font-size: 15px; }
  #flight span { color: #8fa0b8; }
  #flight:empty { display: none; }
  #tape { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); width: 56px; height: 240px; pointer-events: none; }
  #menu[hidden], #landing[hidden], #map[hidden], #net:empty { display: none; }   /* the id's display rule would beat [hidden] */
  /* Esc menu: opens whenever the mouse is free (outside chat and the landing card). */
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    background: rgba(2,3,10,0.55); color: #e6edf6; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #menu .card { width: min(340px, 100%); display: flex; flex-direction: column; gap: 10px; background: rgba(11,15,24,0.92); padding: 18px 20px; border-radius: 8px; }
  #menu h2 { margin: 0; font: 600 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
  #menu h3 { margin: 6px 0 0; font-size: 11px; color: #8fa0b8; text-transform: uppercase; letter-spacing: 0.1em; }
  #menu input, #menu button, #menu select { font: inherit; padding: 6px 8px; border-radius: 4px; border: 1px solid #4a5568; background: #0b0f18; color: #fff; }
  #menu button { background: #2b6cb0; border-color: #2b6cb0; cursor: pointer; }
  #menu .row { display: flex; gap: 8px; }
  #menu .row input { flex: 1; min-width: 0; }
  #menu label { display: flex; align-items: center; gap: 8px; }
  #menu input[type=range] { flex: 1; padding: 0; }
  #menu #fps, #menu #stats { color: #8fa0b8; font-size: 11px; }
  #menuMsg { font-size: 12px; color: #ffb4a8; }
  #menuMsg:empty { display: none; }
  #landing {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px; box-sizing: border-box; text-align: center; color: #e6edf6; font: 14px/1.5 ui-monospace, Menlo, monospace;
    background: radial-gradient(ellipse at center, rgba(2,3,10,0.3), rgba(2,3,10,0.85));
  }
  #landing h1 { margin: 0; font: 600 clamp(28px, 7vw, 52px)/1.1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
  #landing p { margin: 0; max-width: 460px; color: #b8c4d6; }
  #landing .keys { font-size: 12px; color: #8fa0b8; }
  #landing .keys b { color: #cfd8e6; }
  #landing .spinner { display: none; width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #e6edf6; border-radius: 50%; animation: spin 0.9s linear infinite; }
  #landing.loading .spinner { display: block; }
  #landing.loading :is(.row, .swatches, #joinMsg, .keys) { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body:has(#landing:not([hidden])) :is(#hud, #perf, #net, #chat, #tape) { display: none; }
  #net .who { color: #8fa0b8; }
  #net {
    position: fixed; left: 16px; top: 16px; color: #cfd8e6;
    font: 12px/1.6 ui-monospace, Menlo, monospace; background: rgba(0,0,0,0.45); padding: 6px 12px; border-radius: 6px;
  }
  #landing .row { display: flex; gap: 8px; }
  #joinMsg { color: #ffb4a8; font-size: 12px; }
  .swatches { display: flex; gap: 8px; }
  body .swatches button { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  body .swatches button.on { border-color: #fff; }
  #joinMsg:empty { display: none; }
  #chat {
    position: fixed; left: 16px; bottom: 96px; width: min(420px, calc(100vw - 32px)); color: #e6edf6;
    font: 13px/1.5 ui-monospace, Menlo, monospace; text-shadow: 0 0 3px #000;
  }
  #chatLog div { background: rgba(0,0,0,0.35); padding: 1px 8px; border-radius: 4px; margin-top: 3px; width: fit-content; max-width: 100%; overflow-wrap: anywhere; }
  #chatLog b { color: #ffd59a; }
  #chatLog .note { color: #9fb0c6; font-style: italic; }
  #chatIn { width: 100%; box-sizing: border-box; margin-top: 6px; font: inherit; padding: 6px 8px; border-radius: 4px; border: 1px solid #4a5568; background: rgba(11,15,24,0.85); color: #fff; }
  #landing input, #landing button { font: inherit; padding: 8px 10px; border-radius: 4px; border: 1px solid #4a5568; background: #0b0f18; color: #fff; }
  #landing button { background: #2b6cb0; border-color: #2b6cb0; cursor: pointer; }
  /* N cycles the HUD: 3 everything, 2 player labels only, 1 nothing but chat. */
  body[data-hud="2"] .poi, body[data-hud="1"] .peer, body.map .peer { visibility: hidden; }
  #map { position: fixed; inset: 0; pointer-events: none; background: #000; }
  body.map :is(#hud, #perf, #tape) { display: none; }
  #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #map canvas:first-child { filter: drop-shadow(0 0 3px rgba(79,227,255,0.8)); }
  #map::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(120,230,255,0.05) 0 1px, transparent 1px 3px); }
  body[data-hud="1"] :is(#hud, #perf, #net, #tape) { display: none; }
  .peer.way { color: #7fffd4; }
  .peer {
    position: fixed; left: 0; top: 0; color: #ffd59a; pointer-events: none; white-space: nowrap;
    font: 12px ui-monospace, Menlo, monospace; text-shadow: 0 0 3px #000;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="map" hidden><canvas id="mapLabels"></canvas></div>
<div id="hud"></div>
<div id="net"></div>
<form id="landing" class="loading">
  <h1>Orbital</h1>
  <p>A ring world 20,000 km across, in the spirit of Iain M. Banks's Culture.</p>
  <div class="spinner"></div>
  <div class="row"><input id="joinName" maxlength="20" placeholder="Your name" autocomplete="off" autofocus><button>Fly</button></div>
  <div class="swatches"></div>
  <div id="joinMsg"></div>
  <p class="keys"><b>Mouse</b> steer · <b>W/S</b> throttle · <b>A/D</b> roll · hold <b>Space</b> look around · <b>V</b> land · <b>Enter</b> chat</p>
</form>
<div id="chat"><div id="chatLog"></div><input id="chatIn" maxlength="200" placeholder="Say something · Enter sends · Esc closes" autocomplete="off" hidden></div>
<div id="perf"><div id="flight"></div></div>
<canvas id="tape"></canvas>
<div id="menu" hidden>
  <div class="card">
    <h2>Menu</h2>
    <button id="resume">Resume</button>
    <h3>You</h3>
    <div class="row" id="renameRow"><input id="menuName" maxlength="20" placeholder="Your name" autocomplete="off"><button id="rename">Rename</button></div>
    <div id="menuMsg"></div>
    <div class="swatches"></div>
    <h3>Display</h3>
    <label>Quality <select id="quality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
    <label>LOD detail <span id="lodLabel"></span><input id="lod" type="range" min="1" max="4" step="0.25" value="2"></label>
    <label><input type="checkbox" id="sound" checked> Sound</label>
    <div id="fps">– fps</div>
    <div id="stats"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// Units are metres. Everything lives in the ring's frame; the Y axis is the ring axis and the floor is
// the inside of a cylinder at radius R. "Height" h is measured toward the axis, so a surface point sits
// at radius R - h. Sea level is h = 0. Across the ring, t = |u| / HW runs from 0 (centreline) to 1 (wall).
const R = 1e7;                          // 10,000 km
const C = 2 * Math.PI * R;              // circumference
const ROOTS = 26;                       // square root tiles around the ring
const TILE0 = C / ROOTS;                // root tile edge, ~2,417 km; also the ring width
const W = TILE0, HW = W / 2;
const WALL = 2e5;                       // 200 km walls
const BOWL_T = 0.8;                     // the floor curves up into the wall from here outward
const GRID = 32, MAX_LEVEL = 20, MAX_TILES = 8192;
const EYE = 1.7, GRAVITY = 9.81;
const DAY_RATE = 2 * Math.PI / 1800;    // the shade turns once every 30 minutes
// Landmarks. Positions are arc length a and across-ring u, in metres.
// Super cities sit on flattened ground. PEAKS are single mountains well above the 8 km ranges; STRAITS are
// where the land strip gives way to sea and islands (all sea within w of the centre, all land beyond 2w).
const MEGAS = [{ a: 0.15 * R, u: 3e4, r: 36000, name: 'Ossuen' }, { a: 3.2 * R, u: -2e4, r: 36000, name: 'Telmarra' }];
const PEAKS = [{ a: 4e5, u: -6e4, r: 9e4, h: 22000 }], STRAITS = [];   // the first peak is 400 km east of the first GSV
{
  // The rest come from a fixed seed, so every player gets the same ring. Each keeps 0.06 rad (600 km) clear of
  // the GSVs, the terrain patches their decks copy (θ ≈ 0.43, 0.64, 3.54, 4.27, 5.14), the cities and each other.
  let seed = 7;
  const rnd = () => (seed = tHash(seed, 1, 5000)) / 2 ** 32;
  const taken = [0, 1.2566, 2.5133, 3.7699, 5.0265, 0.43, 0.64, 3.54, 4.27, 5.14, ...MEGAS.map(c => c.a / R), PEAKS[0].a / R];
  const clear = th => taken.every(t => { const d = Math.abs(th - t) % (2 * Math.PI); return Math.min(d, 2 * Math.PI - d) > 0.06; });
  while (PEAKS.length < 6 || STRAITS.length < 7) {
    const th = rnd() * 2 * Math.PI;
    if (!clear(th)) continue;
    taken.push(th);
    if (PEAKS.length < 6 && (STRAITS.length >= 7 || rnd() < 0.5)) {
      const h = 12000 + 10000 * rnd();
      PEAKS.push({ a: th * R, u: (rnd() - 0.5) * 1.2e5, r: 9e4 * h / 22000 * (0.8 + 0.4 * rnd()), h });
    } else STRAITS.push({ a: th * R, w: 6e4 + 1.4e5 * rnd() });
  }
}

const clamp = THREE.MathUtils.clamp, smoothstep = THREE.MathUtils.smoothstep, lerp = THREE.MathUtils.lerp;
const wrapA = a => ((a % C) + C) % C;
const f1 = x => x.toFixed(1);           // JS number -> GLSL float literal

// --- Quality ---
// Presets trade detail for speed. lod: tile split distance. minRes, maxRes: the range dynamic resolution works
// in (device pixels per CSS pixel); only low goes under 1, where the picture turns grainy. shrubR, buildR: chunk radii for shrubs and buildings. speedK: top speed per metre of height.
// 'Auto' plays the first seconds at medium, picks a preset from how dynamic resolution copes, and saves it.
// MSAA can only change when the page loads, so a new preset's aa applies on the next visit.
const QUALITY = {
  low:    { lod: 1,   minRes: 0.75, maxRes: 1,    aa: false, shrubR: 1, buildR: 3, speedK: 1 },
  medium: { lod: 1.5, minRes: 1,   maxRes: 1.25, aa: true,  shrubR: 2, buildR: 4, speedK: 1.5 },
  high:   { lod: 2,   minRes: 1,   maxRes: 1.5,  aa: true,  shrubR: 3, buildR: 6, speedK: 2 },
};
let qSetting = 'auto', qName = null;
try { qSetting = localStorage.getItem('quality') || 'auto'; qName = qSetting === 'auto' ? localStorage.getItem('qualityAuto') : qSetting; } catch {}
let Q = QUALITY[qName] ?? QUALITY.medium, autoPickAt = QUALITY[qName] ? Infinity : performance.now() + 10000;

const renderer = new THREE.WebGLRenderer({ antialias: Q.aa, logarithmicDepthBuffer: true });
// Dynamic resolution: the loop lowers this toward the preset's minRes when frames drop under 45 fps and
// raises it back toward maxRes when they run near 60.
let res = Math.min(devicePixelRatio, Q.maxRes);
renderer.setPixelRatio(res);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
// The camera never moves from the origin. Its true position is camPos (JS doubles), and the world is
// drawn relative to it, which keeps GPU numbers small near the viewer.
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1e8);
const camPos = new THREE.Vector3();

const stars = (() => {
  const n = 5000, p = new Float32Array(n * 3), v = new THREE.Vector3();
  for (let i = 0; i < n; i++) v.randomDirection().multiplyScalar(9e7).toArray(p, i * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false }));
})();
stars.renderOrder = -2;
scene.add(stars);

// Sky: a sphere around the camera, drawn just after the stars and before everything else, with no depth
// test. Each pixel runs the atmosphere along its view direction and blends the lit air over the stars.
const sky = new THREE.Mesh(new THREE.SphereGeometry(4e7, 32, 16), new THREE.ShaderMaterial({
  uniforms: null, side: THREE.BackSide, depthTest: false, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
}));
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);
scene.add(new THREE.AmbientLight(0x8899cc, 0.2));

// Sun, shade, hull and clouds use plain ring-frame coordinates, shifted by -camPos each frame. At 10^7 m
// that leaves about a metre of float error, which only shows if you press your face to the hull.
const farGroup = new THREE.Group();
scene.add(farGroup);

// --- Day and night ---
// A sun at the centre lights the whole floor straight down. A half-shell shade around it turns, and the
// half of the ring behind it is in night. There are no shadow maps: materials scale their direct light by
// dayFactor(azimuth), which matches what the shade blocks.
const dayUniforms = { uDayAngle: { value: 0 }, uLocalDay: { value: 1 }, uCamPos: { value: new THREE.Vector3() } };
const dayFactor = th => smoothstep(Math.cos(th - dayUniforms.uDayAngle.value), -0.06, 0.06);
const DAY_GLSL = /* glsl */`
uniform float uDayAngle;
uniform float uLocalDay;
varying float vDay;
float dayFactor(float th) { return smoothstep(-0.06, 0.06, cos(th - uDayAngle)); }

// --- Atmosphere ---
// Air sits between the walls with an 8 km scale height. For a ray from the camera to camera + rel, add up
// the air along it (optical depth) and how much of that air is sunlit. Samples cluster at both ends of
// the ray, where the air is: across the ring, the middle of a ray is in space.
uniform vec3 uCamPos;
const float ATM_H = 8000.0, ATM_BETA = 1.0 / 90000.0;   // optical depth 1 per 90 km of sea-level air
const vec3 ATM_EXT = vec3(0.55, 0.85, 1.6);             // blue scatters most
const vec3 ATM_SKY = vec3(0.30, 0.52, 1.0);             // colour of fully lit air
const vec3 ATM_NIGHT = vec3(0.025, 0.03, 0.05);         // unlit air, faintly lit by ringshine
void atmosphere(vec3 rel, int n, out vec3 trans, out vec3 inscat) {
  float tau = 0.0, lit = 0.0;
  for (int k = 0; k < 16; k++) {
    if (k >= n) break;
    float x = (float(k) + 0.5) / float(n);
    float y = 2.0 * min(x, 1.0 - x), w = 4.0 * y * y * y;   // w = ds/dx
    float s = x < 0.5 ? 0.5 * y * y * y * y : 1.0 - 0.5 * y * y * y * y;
    vec3 p = uCamPos + rel * s;
    float alt = ${f1(R)} - length(p.xz);
    float dens = (abs(p.y) < ${f1(HW)} && alt > -4000.0) ? exp(-max(alt, 0.0) / ATM_H) : 0.0;
    tau += dens * w;
    lit += dens * w * dayFactor(atan(p.z, p.x));
  }
  float scale = length(rel) * ATM_BETA / float(n);
  tau *= scale; lit *= scale;
  // Only sunlit air shifts colour (blue scattered out, blue scattered back in). Unlit air would otherwise
  // filter distant night ground to red-brown with nothing to balance it, so it dims evenly toward ATM_NIGHT.
  float f = tau > 0.0 ? lit / tau : 0.0;
  vec3 tSun = exp(-tau * ATM_EXT);
  float tGrey = exp(-tau * 0.9);
  trans = mix(vec3(tGrey), tSun, f);
  inscat = ATM_SKY * (1.0 - tSun) * f + ATM_NIGHT * (1.0 - tGrey) * (1.0 - f);
}`;
// mode 'tile': the tile code sets vDay. 'ring': from the ring-frame vertex position. 'local': one value
// for small things near the camera (ship, shrubs).
function patchDay(shader, mode) {
  Object.assign(shader.uniforms, dayUniforms);
  shader.vertexShader = DAY_GLSL + '\nvarying vec3 vAtmT;\nvarying vec3 vAtmI;\n' + shader.vertexShader;
  if (mode === 'ring') shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', /* glsl */`#include <begin_vertex>
    vec4 ringP = vec4(transformed, 1.0);
    #ifdef USE_INSTANCING
      ringP = instanceMatrix * ringP;
    #endif
    vDay = dayFactor(atan(ringP.z, ringP.x));
    atmosphere(ringP.xyz - uCamPos, 6, vAtmT, vAtmI);`);
  if (mode === 'local') shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvDay = uLocalDay;');
  // vDay dims only the sun (the one point light), so the ship's headlight still lights things at night.
  shader.fragmentShader = 'varying float vDay;\n' + shader.fragmentShader.replace('#include <lights_fragment_begin>',
    THREE.ShaderChunk.lights_fragment_begin.replace('getPointLightInfo( pointLight, geometryPosition, directLight );', '$&\ndirectLight.color *= vDay;')
  ).replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\ntotalEmissiveRadiance *= vDay;' +
    // Daytime sky light: the sun is always overhead, so without this every wall and cliff side is black.
    '\nreflectedLight.indirectDiffuse += diffuseColor.rgb * vec3(0.30, 0.38, 0.50) * vDay;' +
    // Night: ringshine, sunlight bounced off the lit half of the ring overhead.
    '\nreflectedLight.indirectDiffuse += diffuseColor.rgb * vec3(0.07, 0.08, 0.11) * (1.0 - vDay);');
  // Haze: things far away (through air) fade toward the sky colour. Ship and shrubs are too close to need it.
  if (mode !== 'local') shader.fragmentShader = 'varying vec3 vAtmT;\nvarying vec3 vAtmI;\n' + shader.fragmentShader.replace(
    '#include <tonemapping_fragment>', 'gl_FragColor.rgb = gl_FragColor.rgb * vAtmT + vAtmI;\n#include <tonemapping_fragment>');
}
const withDay = (mat, mode) => { mat.onBeforeCompile = s => patchDay(s, mode); return mat; };

sky.material.uniforms = dayUniforms;
sky.material.vertexShader = /* glsl */`
  varying vec3 vDir;
  void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
sky.material.fragmentShader = DAY_GLSL + /* glsl */`
  varying vec3 vDir;
  void main() {
    vec3 trans, inscat;
    atmosphere(normalize(vDir) * 2.5e7, 10, trans, inscat);   // long enough to cross the ring
    // Bright air hides the stars (the eye adapts to it); dark air on the night side leaves them visible.
    gl_FragColor = vec4(inscat, clamp(dot(inscat, vec3(0.333)) * 8.0, 0.0, 1.0));
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

const sunLight = new THREE.PointLight(0xfff4e0, 2.1, 0, 0); // no falloff: equal light everywhere
farGroup.add(sunLight);
farGroup.add(new THREE.Mesh(new THREE.SphereGeometry(8e4, 32, 16), new THREE.MeshBasicMaterial({ color: 0xfff2c0 })));
// Half sphere covering azimuths [-ρ, π - ρ] for rotation.y = ρ; rotated each frame to sit opposite the day side.
const shade = new THREE.Mesh(
  new THREE.SphereGeometry(1.2e5, 48, 24, 0, Math.PI),
  new THREE.MeshStandardMaterial({ color: 0x14161c, metalness: 0.8, roughness: 0.4, side: THREE.DoubleSide })
);
farGroup.add(shade);

// --- Terrain noise ---
// Gradient noise on an integer lattice over (arc length a, across u). Octave i has 32·2^i cells per
// root tile, so lattice coordinates are exact integers derived from tile indices on the GPU, and the
// lattice wraps cleanly around the ring. heightAt() in JS computes the same thing for the ship and walker.
const TERRAIN_VERT = /* glsl */`
attribute uvec3 aIdx;    // tile index along the ring, across the ring, level
attribute vec4 aCenter;  // tile centre minus camera (xyz), tile centre angle (w)
varying float vH;        // height
varying float vT;        // across-ring position, 0 centre to 1 wall
varying float vN;        // base noise, for vegetation patches
varying float vD;        // fine noise relative to the tile, for ragged colour-band edges
varying float vRiver;    // river noise: water where it's near zero
varying float vLake;     // lake noise: water where it's high
varying vec3 vUpV;       // local up in view space, for slope
varying float vSkirt;    // 0 on the surface, above 0 on a skirt face
varying float vFarm;     // farm-region noise
varying float vUrban;    // 1 inside a settlement, fading at its edge
varying float vFarmNear; // 1 within a few radii of a settlement
varying vec2 vMega;      // offset from the nearest super city's centre, in metres (x east, y across)
flat varying uvec2 vFieldBase;  // field lattice: integer origin for this tile...
varying vec2 vFieldLf;          // ...and position from it, in ~300 m field cells
uniform vec4 uTowns[64];        // nearest settlements: centre minus camera (xyz), radius (w)
uniform int uTownCount;
#ifdef DECK
uniform vec4 uDeck;           // this GSV's source patch (k0, ku in level-8 tiles), deck half length and half width
#endif
// Settlement outline: the edge distance over r by direction, seeded by r. townShape() in JS is the twin.
float townShape(vec3 diff, vec3 tp, float r) {
  vec3 east = normalize(vec3(-tp.z, 0.0, tp.x));
  float th = atan(diff.y, dot(diff, east)), p = fract(r * 0.1234) * 6.2832;
  return 1.0 + 0.28 * sin(2.0 * th + p) + 0.22 * sin(3.0 * th + 1.7 * p) + 0.12 * sin(5.0 * th + 2.9 * p);
}

const vec2 GRADS[8] = vec2[8](vec2(1, 0), vec2(-1, 0), vec2(0, 1), vec2(0, -1),
  vec2(0.7071, 0.7071), vec2(-0.7071, 0.7071), vec2(0.7071, -0.7071), vec2(-0.7071, -0.7071));

uint tHash(uvec2 p, uint seed) {

  s.moveTo(cx - x + r, cy - y); s.lineTo(cx + x - r, cy - y); s.quadraticCurveTo(cx + x, cy - y, cx + x, cy - y + r);
  s.lineTo(cx + x, cy + y - r); s.quadraticCurveTo(cx + x, cy + y, cx + x - r, cy + y);
  s.lineTo(cx - x + r, cy + y); s.quadraticCurveTo(cx - x, cy + y, cx - x, cy + y - r);
  s.lineTo(cx - x, cy - y + r); s.quadraticCurveTo(cx - x, cy - y, cx - x + r, cy - y);
  return s;
}
function extrudeHull(shape, depth, top, mats = [hullTex.cap, hullTex.side]) {  // extrude groups: 0 caps, 1 side walls
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 6 }).rotateX(-Math.PI / 2).translate(0, -depth - top, 0);
  return new THREE.Mesh(geo, mats);
}
// A glowing docking-bay mouth on a long side, facing out (side = ±1 across); x east, h below the deck.
function dockMouth(group, side, across, x, h) {
  for (const [w, ht, mat, off] of [[1300, 500, hullTex.cool, 3], [1200, 400, hullTex.dark, 6]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, ht), mat);
    m.rotation.y = side * Math.PI / 2;
    m.position.set(side * (across + off), h, -x);
    group.add(m);
  }
}
// A glowing bar from (x1, y1, h1) to (x2, y2, h2), in deck coordinates (local X is south, -Z east).
function glowBar(group, a, b, r, mat = hullTex.cool) {
  const p = new THREE.Vector3(-a[1], a[2], -a[0]), q = new THREE.Vector3(-b[1], b[2], -b[0]);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, p.distanceTo(q), 8), mat);
  m.position.copy(p).add(q).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(Yv, q.sub(p).normalize());
  group.add(m);
}

// Each builder adds the hull under the deck and returns its depth plus the shuttle ports:
// { at: [x, y, h], dir: [dx, dy, dh] } in deck coordinates.
const HULLS = {
  // A rounded slab with six landing bays cut through it (lit ceilings 400 m up) and ten docking bays a side.
  slab(g, grp) {
    const T = 2000, W = g.W + 400, L = g.L + 400, shape = roundedRect(W, L, 200), bays = [], ports = [];
    for (const bx of [-W / 4, W / 4]) for (const by of [-0.32 * L, 0, 0.32 * L]) bays.push([bx, by]);
    for (const [bx, by] of bays) {
      shape.holes.push(roundedRect(1000, 2000, 1, bx, by));
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(1000, 2000).rotateX(Math.PI / 2), hullTex.warm);   // faces down
      ceil.position.set(bx, -T + 400, -by);
      grp.add(ceil);
      for (let k = 0; k < 2; k++) ports.push({ at: [by, bx, -T], dir: [rnd(-0.4, 0.4), rnd(-0.4, 0.4), -1] });
    }
    grp.add(extrudeHull(shape, T, 2));
    for (const side of [-1, 1]) for (let i = 0; i < 10; i++) {
      const x = lerp(-0.42 * L, 0.42 * L, i / 9);
      dockMouth(grp, side, W / 2, x, -T / 2);
      ports.push({ at: [x, -side * W / 2, -T / 2], dir: [0, -side, -0.15] });
    }
    return { depth: T, ports };
  },
  // A needle: the hull's top is exactly the deck rectangle, so nothing shows past the deck. Below it a
  // rounded keel (half-ellipse cross-sections, full deck width at the top edge) is deepest amidships and
  // tapers to a quarter of that at the end faces, where slim spikes run fore and aft below deck level.
  // Warm window bands run down both flanks and a cool light along the keel line.
  needle(g, grp) {
    const Lh = g.L / 2, Rw = g.W / 2, D = 3500, NZ = 48, NT = 24, ports = [];
    const depth = z => D * (0.25 + 0.75 * Math.sqrt(Math.max(1 - (z / Lh) ** 2, 0)));
    // Surface point at length z (local, -Z east) and angle t (0 and pi: top edges, pi/2: keel line).
    const at = (z, t, grow = 0) => [(Rw + grow) * Math.cos(t), -3 - (depth(z) + grow) * Math.sin(t), z];
    const pos = [], idx = [];
    for (let i = 0; i <= NZ; i++) for (let j = 0; j <= NT; j++) pos.push(...at(-Lh + 2 * Lh * i / NZ, Math.PI * j / NT));
    for (let i = 0; i < NZ; i++) for (let j = 0; j < NT; j++) {
      const a = i * (NT + 1) + j, b = a + NT + 1;
      idx.push(a, b, b + 1, a, b + 1, a + 1);   // wound so normals face outward
    }
    const keel = new THREE.BufferGeometry();
    keel.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    keel.setIndex(idx);
    keel.computeVertexNormals();
    grp.add(new THREE.Mesh(keel, hullTex.plain));
    grp.add(new THREE.Mesh(new THREE.PlaneGeometry(2 * Rw, 2 * Lh).rotateX(-Math.PI / 2).translate(0, -3, 0), hullTex.plain));
    for (const end of [-1, 1]) {   // end -1: east (-Z)
      const face = new THREE.Shape(Array.from({ length: NT + 1 }, (_, j) => { const [x, y] = at(end * Lh, Math.PI * j / NT); return new THREE.Vector2(x, y); }));
      const cap = new THREE.Mesh(new THREE.ShapeGeometry(face), hullTex.plain);
      cap.position.z = end * Lh;
      if (end < 0) cap.rotation.y = Math.PI;
      grp.add(cap);
      const dEnd = depth(Lh);
      const spike = new THREE.Mesh(new THREE.ConeGeometry(1200, 9000, 24).rotateX(end * Math.PI / 2).scale(1, 0.3, 1), hullTex.plain);
      spike.position.set(0, -3 - 0.45 * dEnd, end * (Lh + 4500 - 300));   // top at -3 - 0.45 dEnd + 360, below the deck
      grp.add(spike);
    }
    const line = (t, grow, r, mat) => {
      const pts = [];
      for (let i = 1; i < NZ; i++) pts.push(new THREE.Vector3(...at(-Lh + 2 * Lh * i / NZ, t, grow)));
      grp.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 96, r, 6), mat));
    };
    for (const t of [0.12, 0.25, 0.75, 0.88]) line(t * Math.PI, 20, 35, hullTex.warm);
    line(Math.PI / 2, 30, 60, hullTex.cool);
    for (const x of [-0.3 * g.L, 0, 0.3 * g.L]) for (let k = 0; k < 2; k++) ports.push({ at: [x, 0, -3 - depth(x)], dir: [rnd(-0.4, 0.4), rnd(-0.4, 0.4), -1] });
    for (const side of [-1, 1]) for (const x of [-0.25 * g.L, 0.25 * g.L]) ports.push({ at: [x, side * Rw, -300], dir: [0, side, -0.1] });
    return { depth: D, ports };
  },
  // Three slabs stacked under the deck, the middle one widest, with glowing seams between them.
  stack(g, grp) {
    const ports = [], layers = [[g.W + 400, g.L + 400, 800], [g.W + 3000, 0.75 * g.L, 1000], [g.W + 800, 0.5 * g.L, 1400]];
    let top = 2;
    layers.forEach(([w, l, t], i) => {
      grp.add(extrudeHull(roundedRect(w, l, 300), t, top));
      if (i) grp.add(extrudeHull(roundedRect(w - 300, l - 300, 300), 150, top - 150, hullTex.cool));
      if (i === 1) for (const side of [-1, 1]) for (let k = 0; k < 6; k++) {
        const x = lerp(-0.4 * l, 0.4 * l, k / 5);
        dockMouth(grp, side, w / 2, x, -top - t / 2);
        ports.push({ at: [x, -side * w / 2, -top - t / 2], dir: [0, -side, -0.15] });
      }
      top += t + 150;
    });
    for (const x of [-0.2 * g.L, 0.2 * g.L]) for (const y of [-g.W / 4, g.W / 4]) ports.push({ at: [x, y, -top + 150], dir: [rnd(-0.4, 0.4), rnd(-0.4, 0.4), -1] });
    return { depth: top, ports };
  },
  // An arrowhead: a pointed nose ahead of the deck and swept fins behind it, edged in light.
  wedge(g, grp) {
    const Wh = g.W / 2 + 300, L2 = g.L / 2, T = 1800, ports = [];
    const pts = [[0, L2 + 12000], [Wh, L2 + 200], [Wh, -L2 + 4000], [Wh + 8000, -L2 - 4000], [Wh, -L2 - 1500],
                 [-Wh, -L2 - 1500], [-Wh - 8000, -L2 - 4000], [-Wh, -L2 + 4000], [-Wh, L2 + 200]];
    grp.add(extrudeHull(new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y))), T, 2));
    // Edge lights along the top and bottom of the outline (shape x is south, so deck y = -x).
    pts.forEach(([x, y], i) => {
      const [x2, y2] = pts[(i + 1) % pts.length];
      for (const h of [-2, -T - 2]) glowBar(grp, [y, -x, h], [y2, -x2, h], 40);
    });
    for (const side of [-1, 1]) for (let k = 0; k < 2; k++) ports.push({ at: [-L2 - 1000, side * (Wh + 2500), -T], dir: [rnd(-0.6, 0), rnd(-0.3, 0.3), -1] });
    for (let k = 0; k < 3; k++) ports.push({ at: [L2 + 6000, 0, -T / 2], dir: [1, rnd(-0.3, 0.3), -0.1] });
    return { depth: T, ports };
  },
  // A deck bridge on two long pontoon hulls, joined by glowing spars.
  catamaran(g, grp) {
    const T = 500, Y = g.W / 2 + 1500, rad = 1800, H = -2600, ports = [];
    grp.add(extrudeHull(roundedRect(g.W + 400, g.L + 400, 200), T, 2));
    for (const side of [-1, 1]) {
      const pont = new THREE.Mesh(new THREE.CapsuleGeometry(rad, g.L + 4000, 6, 24).rotateX(Math.PI / 2).scale(1, 0.8, 1), hullTex.plain);
      pont.position.set(-side * Y, H, 0);
      grp.add(pont);
      for (let k = 0; k < 5; k++) {
        const x = lerp(-0.4 * g.L, 0.4 * g.L, k / 4);
        glowBar(grp, [x, side * (g.W / 2 - 200), -T - 2], [x, side * Y, H + 0.6 * rad], 120);
      }
      glowBar(grp, [-(g.L / 2 + 2000), side * (Y + rad), H], [g.L / 2 + 2000, side * (Y + rad), H], 60, hullTex.warm);   // light line down the outer flank
      for (const end of [-1, 1]) ports.push({ at: [end * (g.L / 2 + 3800), side * Y, H], dir: [end, rnd(-0.2, 0.2), -0.1] });
      for (const x of [-0.25 * g.L, 0.25 * g.L]) ports.push({ at: [x, side * Y, H - 0.8 * rad], dir: [rnd(-0.4, 0.4), rnd(-0.4, 0.4), -1] });
    }
    return { depth: -H + rad, ports };
  },
};

// Deck tiles: one instanced quadtree mesh per GSV, sharing tileGeo. Each material carries its own patch.
const DECK_MAX = 2048;
GSVS.forEach((g, gi) => {
  g.L = g.n * S8; g.W = g.m * S8;
  const th = g.a / R;
  g.E = new THREE.Vector3(-Math.sin(th), 0, Math.cos(th));    // east, along the deck
  g.UP = new THREE.Vector3(-Math.cos(th), 0, -Math.sin(th));  // toward the axis
  g.pos = ringPoint(g.a, g.u, g.alt, new THREE.Vector3());
  g.q = levelQ(g.a, new THREE.Quaternion());
  g.hull = new THREE.Group();
  g.hull.quaternion.copy(g.q);
  Object.assign(g, HULLS[g.kind](g, g.hull));
  scene.add(g.hull);

  const tiles = new THREE.InstancedBufferGeometry();
  tiles.setAttribute('position', tileGeo.attributes.position);
  tiles.setIndex(tileGeo.index);
  g.idx = new THREE.InstancedBufferAttribute(new Uint32Array(DECK_MAX * 3), 3).setUsage(THREE.DynamicDrawUsage);
  g.center = new THREE.InstancedBufferAttribute(new Float32Array(DECK_MAX * 4), 4).setUsage(THREE.DynamicDrawUsage);
  tiles.setAttribute('aIdx', g.idx);
  tiles.setAttribute('aCenter', g.center);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.9, side: THREE.DoubleSide, flatShading: true });
  mat.defines = { DECK: '' };
  const uDeck = { value: new THREE.Vector4(g.k0, g.ku, g.L / 2, g.W / 2) };
  mat.onBeforeCompile = sh => { patchTiles(sh); sh.uniforms.uDeck = uDeck; };
  g.tiles = tiles;
  g.deck = new THREE.Mesh(tiles, mat);
  g.deck.frustumCulled = false;
  scene.add(g.deck);

  // Parkland city at the deck centre, built once in deck coordinates with the ring's city cells.
  const cityR = Math.min(6000, 0.42 * g.W, 0.3 * g.L), sp = BUILD[0].spacing, list = [];
  const ground = (x, y) => [deckH(g, x, y), terrainAt(...deckSrc(g, x, y))[1]];
  for (let ix = -Math.ceil(TOWN_REACH * cityR / sp); ix <= TOWN_REACH * cityR / sp; ix++)
    for (let iy = -Math.ceil(TOWN_REACH * cityR / sp); iy <= TOWN_REACH * cityR / sp; iy++) {
      const x = ix * sp, y = iy * sp;
      if (Math.abs(x) > g.L / 2 - 1600 || Math.abs(y) > g.W / 2 - 1600) continue;   // stay off the flattened rim
      const q = Math.hypot(x, y) / (cityR * townShape(cityR + gi, x, y));
      if (q <= 1) parkCell(list, x, y, q, 0, ix + 5e6 + gi * 1e5, iy, ground);
    }
  g.city = new THREE.Group();
  // Deck frame: x east, y toward the axis, z = x × y; the group sits at the deck centre.
  const q0 = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(g.E, g.UP, new THREE.Vector3().crossVectors(g.E, g.UP)));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  for (const [kind, src] of Object.entries(bMeshes)) {
    const items = list.filter(b => b.kind === kind);
    const mesh = new THREE.InstancedMesh(src.geometry, src.material, Math.max(items.length, 1));
    mesh.count = items.length;
    mesh.frustumCulled = false;
    items.forEach((b, n) => {
      deckPoint(g, b.a, b.u, b.g - 1, p).sub(g.pos);
      mesh.setMatrixAt(n, m.compose(p, q.copy(q0).multiply(bq2.setFromAxisAngle(Yv, b.rot)), sc.set(b.w, b.height, b.d)));
      mesh.setColorAt(n, b.color);
    });
    g.city.add(mesh);
  }
  scene.add(g.city);
});
let deckCount = 0;

// Same rule as visit(): split while the camera is closer than lodDetail × the tile size.
function visitDeck(g, c, ka, ku, level) {
  const size = TILE0 / 2 ** level, k = 2 ** (level - 8);
  const x0 = (ka - g.k0 * k) * size - g.L / 2, y0 = (ku - g.ku * k) * size - g.W / 2;
  deckPoint(g, x0 + size / 2, y0 + size / 2, 0, sphere.center).sub(camPos);
  sphere.radius = 0.75 * size + 1000;
  if (!frustum.intersectsSphere(sphere)) return;
  const dist = Math.hypot(c.x - clamp(c.x, x0, x0 + size), c.y - clamp(c.y, y0, y0 + size), c.h - clamp(c.h, 0, 1000));
  if (level < MAX_LEVEL && dist < size * lodDetail) {
    visitDeck(g, c, 2 * ka, 2 * ku, level + 1);
    visitDeck(g, c, 2 * ka + 1, 2 * ku, level + 1);
    visitDeck(g, c, 2 * ka, 2 * ku + 1, level + 1);
    visitDeck(g, c, 2 * ka + 1, 2 * ku + 1, level + 1);
  } else if (g.count < DECK_MAX) {
    g.idx.array.set([ka, ku, level], g.count * 3);
    g.center.array.set([sphere.center.x, sphere.center.y, sphere.center.z, g.a / R], g.count * 4);
    g.count++;
  }
}

// Name and distance tags over other players and the GSVs. rel is the position relative to the camera.
const fmtDist = d => d < 1e4 ? `${d.toFixed(0)} m` : `${(d / 1000).toFixed(0)} km`;
const labelV = new THREE.Vector3();
function placeLabel(el, rel, text) {
  labelV.copy(rel).project(camera);
  const show = labelV.z < 1 && Math.abs(labelV.x) < 1 && Math.abs(labelV.y) < 1;
  el.style.display = show ? '' : 'none';
  if (show) {
    el.textContent = `◆ ${text ? text + ' · ' : ''}${fmtDist(rel.length())}`;
    el.style.transform = `translate(${(labelV.x + 1) / 2 * innerWidth}px, ${(1 - labelV.y) / 2 * innerHeight}px) translate(-50%, -150%)`;
  }
}
for (const g of GSVS) {
  g.label = document.createElement('div');
  g.label.className = 'peer poi';
  document.body.append(g.label);
}
// Runs after updateTiles(), which sets the frustum.
function updateGsv() {
  deckCount = 0;
  for (const g of GSVS) {
    g.hull.position.copy(g.pos).sub(camPos);
    g.city.position.copy(g.hull.position);
    placeLabel(g.label, g.hull.position, g.name);
    g.count = 0;
    const c = deckCoords(g, camPos);
    for (let i = 0; i < g.n; i++) for (let j = 0; j < g.m; j++) visitDeck(g, c, g.k0 + i, g.ku + j, 8);
    g.tiles.instanceCount = g.count;
    g.idx.needsUpdate = g.center.needsUpdate = true;
    deckCount += g.count;
  }
}

function spawn() {
  auto = null; setGear(0);
  // In the ship, 300 m up, 60 km west of a GSV and facing it. The GSV is one in good light (within
  // 1 rad of noon) with the most daylight left; the GSVs are 72° apart, so one always qualifies.
  // Noon is at azimuth uDayAngle, and it moves toward larger azimuths.
  const off = g => { const d = g.a / R - dayUniforms.uDayAngle.value; return d - Math.round(d / (2 * Math.PI)) * 2 * Math.PI; };
  const g = GSVS.filter(g => Math.abs(off(g)) < 1).sort((x, y) => off(y) - off(x))[0];   // largest offset: earliest in its morning
  const a = wrapA(g.a - g.L / 2 - 60000);
  ringPoint(a, g.u, Math.max(heightAt(a, g.u), 0) + 300, shipPos);
  levelQ(a, shipQ);
  camQ.copy(shipQ);
  shipSpeed = 100;
  mode = 'ship';
  headlight.intensity = dayFactor(a / R) > 0.5 ? 0 : 3;   // off in daylight; L turns it on
  updateHud();
}

function toWalk(p = shipPos) {
  // Drop straight down below p (the ship, unless given), onto a GSV deck if it's over one; the ship stays parked.
  // On a deck (player.gsv), player.a and player.u are deck x and y instead of ring coordinates.
  mode = 'walk';
  // On the moon, player.moon is the unit direction from its centre; a and u aren't used.
  player.moon = p.distanceTo(MOON.c) < MOON.r + 5e4 ? new THREE.Vector3().subVectors(p, MOON.c).normalize() : null;
  if (player.moon) {
    player.gsv = null;
    Object.assign(player, { pitch: 0, z: 0, vz: 0 });
    updateHud();
    return;
  }
  const dk = deckLocal(p);
  player.gsv = dk.on ? dk.g : null;
  if (dk.on) {
    player.a = clamp(dk.x, -dk.g.L / 2 + 10, dk.g.L / 2 - 10);
    player.u = clamp(dk.y, -dk.g.W / 2 + 10, dk.g.W / 2 - 10);
  } else {
    player.a = wrapA(Math.atan2(p.z, p.x) * R);
    player.u = clamp(p.y, -HW + 10, HW - 10);
  }
  Object.assign(player, { pitch: 0, z: 0, vz: 0 });
  updateHud();
}

function toShip() {
  // Get in: the landed ship if it's within 100 m, else it comes down beside you. Then it lifts off.
  blendCam();
  const near = shipGear.visible && shipPos.distanceTo(camPos) < 100;
  mode = 'ship';
  if (!near) {
    const d = player.moon, g = player.gsv;
    if (d) shipPos.copy(MOON.c).addScaledVector(d, MOON.r + moonH(d) + GEAR_H);
    else if (g) deckPoint(g, player.a, player.u, deckH(g, player.a, player.u) + GEAR_H, shipPos);
    else ringPoint(player.a, player.u, Math.max(heightAt(player.a, player.u), 0) + GEAR_H, shipPos);
    walkFrame();
    levelOn(up, fwd.copy(east).multiplyScalar(Math.cos(player.yaw)).addScaledVector(north, Math.sin(player.yaw)), shipQ);
  }
  player.moon = null;
  camQ.copy(shipQ);
  shipSpeed = 0;
  const g0 = new THREE.Vector3(), u0 = new THREE.Vector3();
  surfaceAt(shipPos, g0, u0);
  auto = { kind: 'lift', t: 0, T: 2.2, start: shipPos.clone(), up: u0, ground: g0 };
  setGear(1);
  kickPuffs(g0, u0);
  updateHud();
}

// V in the ship: it flies itself down to the ground (or a deck, or the moon) a little ahead, levels out,
// puts its legs down and settles, kicking up dust. Then you step out beside it. V on foot: get in, lift off.
let auto = null;   // {kind: 'land' | 'lift', t, T, start, target, up, ground, q0, q1}
let camBlend = null;   // {t, pos, q}: the camera eases from here to wherever the new mode puts it
const blendCam = () => { camBlend = { t: 0, pos: camPos.clone(), q: camera.quaternion.clone() }; };
// The surface point under p and its up direction; false in open space.
function surfaceAt(p, out, upOut) {
  const md = p.distanceTo(MOON.c);
  if (md < MOON.r + 5e4) {
    upOut.subVectors(p, MOON.c).divideScalar(md);
    out.copy(MOON.c).addScaledVector(upOut, MOON.r + moonH(upOut));
    return true;
  }
  const dk = deckLocal(p);
  if (dk.on) { upOut.copy(dk.g.UP); deckPoint(dk.g, dk.x, dk.y, deckH(dk.g, dk.x, dk.y), out); return true; }
  const r = Math.hypot(p.x, p.z);
  if (r > R + 1000 || Math.abs(p.y) > HW) return false;
  const a = wrapA(Math.atan2(p.z, p.x) * R), u = clamp(p.y, -HW + 10, HW - 10);
  ringPoint(a, u, Math.max(heightAt(a, u), 0), out);
  upOut.set(-p.x / r, 0, -p.z / r);
  return true;
}
// A level attitude on a surface with this up, nose along fwdHint as far as it can.
function levelOn(upV, fwdHint, out) {
  fwdP.copy(fwdHint).projectOnPlane(upV);
  if (fwdP.lengthSq() < 1e-6) fwdP.set(0, 1, 0).applyQuaternion(shipQ).projectOnPlane(upV);   // nose straight down: use the belly's heading
  fwdP.normalize();
  right.crossVectors(fwdP, upV);
  return out.setFromRotationMatrix(basis.makeBasis(right, upV, fwdP.negate()));
}
function startLanding() {
  fwd.set(0, 0, -1).applyQuaternion(shipQ);
  const target = new THREE.Vector3(), u0 = new THREE.Vector3();
  if (!surfaceAt(pv.copy(shipPos).addScaledVector(fwd, Math.min(shipSpeed * 1.5, 300)), target, u0)) return toWalk();   // open space
  const ground = target.clone();
  target.addScaledVector(u0, GEAR_H);

const PUFF_N = 40, puffs = [], puffAt = { t: 9, pos: new THREE.Vector3(), up: new THREE.Vector3(), e1: new THREE.Vector3(), e2: new THREE.Vector3() };
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const cx = cv.getContext('2d'), gr = cx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

function updateShip(dt) {
  if (keys.has('KeyW')) shipSpeed = Math.min(Math.max(shipSpeed, 5) * Math.exp(1.5 * dt), SHIP_MAX);
  if (keys.has('KeyS')) shipSpeed = shipSpeed < 1 ? 0 : shipSpeed * Math.exp(-2.5 * dt);
  const cap = speedCap();
  if (shipSpeed > cap) shipSpeed = cap + (shipSpeed - cap) * Math.exp(-3 * dt);

  // A/D roll. Without roll input inside the ring, the wings drift back to level with the local floor.
  // Outside it (past the walls or the hull) there is no floor to level with, so rotation stays free.
  const roll = (keys.has('KeyA') ? 1 : 0) - (keys.has('KeyD') ? 1 : 0), r0 = Math.hypot(shipPos.x, shipPos.z);
  if (roll) shipQ.multiply(dq.setFromAxisAngle(Z, roll * 1.5 * dt));

    up.set(-shipPos.x / r0, 0, -shipPos.z / r0);

    shipQ.multiply(dq.setFromAxisAngle(Z, -right.dot(up) * 1.5 * dt));

  fwd.set(0, 0, -1).applyQuaternion(shipQ);

  shipPos.addScaledVector(fwd, step);

    const d = pv.copy(shipPos).sub(hit.p).dot(hit.n);
    if (d < SOLID_GAP) shipPos.addScaledVector(hit.n, SOLID_GAP - d);
    if (impact(shipSpeed * Math.max(-fwd.dot(hit.n), 0), hit.n)) return;
  }

  // Keep above the ground or water while over the floor.
  const r = Math.hypot(shipPos.x, shipPos.z);
  shipAlt = Infinity;
  if (r < R + 1000 && Math.abs(shipPos.y) < HW) {
    const a = wrapA(Math.atan2(shipPos.z, shipPos.x) * R);
    const minR = R - Math.max(heightAt(a, shipPos.y), 0) - CLEARANCE;
    if (r > minR) {
      shipPos.x *= minR / r; shipPos.z *= minR / r;
      if (impact(shipSpeed * Math.max((fwd.x * shipPos.x + fwd.z * shipPos.z) / minR, 0), up.set(-shipPos.x / minR, 0, -shipPos.z / minR))) return;
    }

  // And above a GSV deck.
  const dk = deckLocal(shipPos);
  if (dk.on) {

    if (dk.h < g) {

    if (mr < g) {

// A line from each wingtip. Points are kept in ring-frame doubles and rewritten relative to the camera

const TRAIL_N = 60, TIPS = [new THREE.Vector3(-TIP_X, 0, TIP_Z), new THREE.Vector3(TIP_X, 0, TIP_Z)];
const trailMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false });
const tipV = new THREE.Vector3();
function makeTrail() {
  const lines = TIPS.map(() => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    const c = new Float32Array(TRAIL_N * 4);
    for (let i = 0; i < TRAIL_N; i++) c.set([1, 1, 1, 0.6 * i / (TRAIL_N - 1)], i * 4);  // newest is last
    g.setAttribute('color', new THREE.BufferAttribute(c, 4));
    const line = new THREE.Line(g, trailMat);
    line.frustumCulled = false;
    scene.add(line);
    return line;

}
function updateTrail(tr, pos, q) {
  const now = performance.now(), lay = now - tr.t > 50;
  if (lay) tr.t = now;
  tr.lines.forEach((line, k) => {
    const pts = tr.pts[k];
    tipV.copy(TIPS[k]).applyQuaternion(q).add(pos);
    if (lay || !pts.length) { pts.push(tipV.clone()); if (pts.length > TRAIL_N) pts.shift(); }
    else pts[pts.length - 1].copy(tipV);

    const arr = line.geometry.attributes.position.array, s = TRAIL_N - pts.length;
    pts.forEach((p, i) => arr.set([p.x - camPos.x, p.y - camPos.y, p.z - camPos.z], (s + i) * 3));

// Felt speed f runs 0..1 on a log scale from 50 m/s to SHIP_MAX. It widens the field of view,
// stretches the engine glow, and fades in streaks of dust that stream past the ship.
// Dust lives in ship-local coordinates (forward is -Z) and drifts backward at the ship's speed,
// capped so the streaks stay readable; each streak is a line from bright head to clear tail.
const DUST_N = 400, DUST_NEAR = 50, DUST_FAR = 300;
const dust = new Float32Array(DUST_N * 3);
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUST_N * 6), 3));
{
  const c = new Float32Array(DUST_N * 8);
  for (let i = 0; i < DUST_N; i++) c.set([0.85, 0.92, 1, 1, 0.85, 0.92, 1, 0], i * 8);
  dustGeo.setAttribute('color', new THREE.BufferAttribute(c, 4));
}
const dustMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, opacity: 0 });
const dustLines = new THREE.LineSegments(dustGeo, dustMat);
dustLines.frustumCulled = false;
scene.add(dustLines);
// Place a mote off the flight line (15-150 m out), so none passes through the ship.
const seedDust = (i, z) => {
  const ang = Math.random() * Math.PI * 2, rad = 15 + 135 * Math.sqrt(Math.random());
  dust.set([rad * Math.cos(ang), rad * Math.sin(ang), z], i * 3);
};
for (let i = 0; i < DUST_N; i++) seedDust(i, DUST_NEAR - Math.random() * (DUST_NEAR + DUST_FAR));

const shipGlow = ship.getObjectByName('glow'), dv = new THREE.Vector3();
let felt = 0;
function updateSpeedFx(dt) {

  felt += (target - felt) * (1 - Math.exp(-4 * dt));

  camera.fov = 60 + 25 * felt;
  camera.updateProjectionMatrix();
  shipGlow.scale.set(1, 1, 1 + 5 * felt);   // flames sit on the nacelle axes, so stretch along z only
  shipGlow.position.z = GLOW_Z + 2 * felt;

  dustMat.opacity = 0.7 * felt;
  dustLines.visible = felt > 0.01;
  if (!dustLines.visible) return;
  const flow = Math.min(shipSpeed, 2000), len = 1 + 60 * felt;
  const arr = dustGeo.attributes.position.array, base = dv.copy(shipPos).sub(camPos);
  for (let i = 0; i < DUST_N; i++) {
    let z = dust[i * 3 + 2] + flow * dt;
    if (z > DUST_NEAR) { seedDust(i, z - DUST_NEAR - DUST_FAR); z = dust[i * 3 + 2]; }
    dust[i * 3 + 2] = z;
    const x = dust[i * 3], y = dust[i * 3 + 1];
    tipV.set(x, y, z).applyQuaternion(shipQ).add(base);

// Starts on the first click (browsers need a gesture). The engine is two detuned saws through a

// M mutes.

  src.buffer = noise;

function updateAudio() {
  if (!audio) return;
  const t = audio.ctx.currentTime, k = 0.1;  // smoothing time constant, s

  const alt = R - Math.hypot(p.x, p.z), dens = Math.abs(p.y) < HW && alt > -4000 ? Math.exp(-Math.max(alt, 0) / 8000) : 0;

  audio.engine.gain.setTargetAtTime(mode === 'ship' ? 0.03 + 0.05 * felt : 0, t, k);

// A cratered moon 300 km in radius, 0.6 R off the axis and 6,500 km past the +y wall. The false sun lights it,

});

function goTo(p) {
  const { s, w } = p.snaps[p.snaps.length - 1];
  if (w) {  // on foot: bring the ship down beside them, on the ring, a GSV deck or the moon
    pv.fromArray(w);
    player.yaw = 0;
    if (pv.distanceTo(MOON.c) < MOON.r + 5e4) { player.moon = pv.sub(MOON.c).normalize().clone(); toShip(); return; }
    const dk = deckLocal(pv);
    player.gsv = dk.on ? dk.g : null;
    player.a = dk.on ? dk.x : wrapA(Math.atan2(w[2], w[0]) * R);
    player.u = dk.on ? dk.y : clamp(w[1], -HW + 10, HW - 10);
    player.yaw = 0;
    toShip();
  } else {  // flying: sit 60 m behind their ship, stopped
    auto = null; setGear(0);
    shipQ.set(s[3], s[4], s[5], s[6]);
    shipPos.set(0, 10, 60).applyQuaternion(shipQ).add(pv.set(s[0], s[1], s[2]));
    camQ.copy(shipQ);
    shipSpeed = 0;
    mode = 'ship';
    updateHud();
  }
}

const lerp3 = (a, b, k, out) => out.set(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k));
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), walkD = new THREE.Vector3(), walkF = new THREE.Vector3(), walkR = new THREE.Vector3(), walkL = new THREE.Vector3(), walkM = new THREE.Matrix4();
function updatePeers() {
  const t = performance.now() - 100;
  for (const p of peers.values()) {
    const sn = p.snaps;
    let b = sn.findIndex(x => x.t > t);
    if (b === -1) b = sn.length - 1;  // nothing newer yet: hold the newest
    const A = sn[Math.max(b - 1, 0)], B = sn[b];
    const k = B.t > A.t ? clamp((t - A.t) / (B.t - A.t), 0, 1) : 1;

    p.ship.position.copy(lerp3(A.s, B.s, k, pv)).sub(camPos);
    p.ship.quaternion.slerpQuaternions(qa.fromArray(A.s, 3), qb.fromArray(B.s, 3), k);
    updateTrail(p.trail, lerp3(A.s, B.s, k, pv), p.ship.quaternion);

    if (B.w && !p.body.visible) p.walkPrev = null;   // just stepped out: don't count the jump from the ship as walking
    p.body.visible = !!B.w;
    if (B.w) {
      lerp3(A.w || B.w, B.w, k, pv);  // eye position; the feet are EYE below it
      if (pv.distanceTo(MOON.c) < 2 * MOON.r) pUp.copy(pv).sub(MOON.c).normalize();
      else { const r = Math.hypot(pv.x, pv.z); pUp.set(-pv.x / r, 0, -pv.z / r); }
      // Speed and heading from the movement since the last frame: face the way they walk, keep it when still.
      const now = performance.now(), dt = Math.min((now - (p.walkT ?? now)) / 1000, 0.1);
      p.walkT = now;
      walkD.copy(pv).sub(p.walkPrev ?? pv).projectOnPlane(pUp);
      p.walkPrev = (p.walkPrev ?? new THREE.Vector3()).copy(pv);
      const v = dt > 0 ? walkD.length() / dt : 0;
      p.face ??= new THREE.Vector3().crossVectors(pUp, X);   // any direction along the ground until they move
      if (v > 0.3) p.face.lerp(walkD.normalize(), 1 - Math.exp(-8 * dt));
      walkF.copy(p.face).projectOnPlane(pUp);
      if (walkF.lengthSq() < 1e-6) walkF.crossVectors(pUp, X);
      walkF.normalize();
      p.body.quaternion.setFromRotationMatrix(walkM.makeBasis(walkR.crossVectors(walkF, pUp), pUp, walkF.negate()));
      p.body.position.copy(pv).addScaledVector(pUp, -EYE).sub(camPos);
      // Limbs swing in step; the swing grows with speed up to a brisk walk and eases out when they stop.
      p.stride = (p.stride ?? 0) + Math.min(v, 6) * dt * 2.6;
      p.swing = lerp(p.swing ?? 0, Math.min(v / 3, 1) * 0.55, 1 - Math.exp(-6 * dt));
      const sw = p.swing * Math.sin(p.stride), [la, ra, ll, rl] = p.body.limbs;
      la.rotation.x = rl.rotation.x = sw;
      ra.rotation.x = ll.rotation.x = -sw;
    }

    placeLabel(p.label, B.w ? walkL.copy(pv).addScaledVector(pUp, 0.3).sub(camPos) : p.ship.position, p.name);
  }
}

const clock = new THREE.Clock();
const fpsEl = document.getElementById('fps'), statsEl = document.getElementById('stats'), flightEl = document.getElementById('flight');
let frames = 0, fpsT = performance.now();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  dayUniforms.uDayAngle.value = epoch === null
    ? dayUniforms.uDayAngle.value + DAY_RATE * dt
    : DAY_RATE * (Date.now() - epoch) / 1000 % (2 * Math.PI);  // shared clock, so everyone sees the same day.
    // The relay sends epoch 0, so the angle is wrapped to keep the float uniform precise.
  const dayAngle = dayUniforms.uDayAngle.value;
  shade.rotation.y = -dayAngle - Math.PI / 2;   // covers azimuths dayAngle + 90°..270°, the night side
  stars.rotation.y = -dayAngle;

  if (mode === 'walk') updateWalk(dt);
  else if (auto) updateAuto(dt);
  else if (boom.t < 0) updateShip(dt);
  if (camBlend) {   // ease from the old view into the new one after landing or boarding
    const k = smoothstep(camBlend.t += dt, 0, 1.2);
    camPos.lerpVectors(camBlend.pos, camPos, k);
    camera.quaternion.slerpQuaternions(camBlend.q, camera.quaternion, k);
    if (k >= 1) camBlend = null;
  }
  updateBoom(dt);
  updatePuffs(dt);
  dayUniforms.uLocalDay.value = dayFactor(Math.atan2(camPos.z, camPos.x));
  dayUniforms.uCamPos.value.copy(camPos);
  ship.position.copy(shipPos).sub(camPos);
  updateShadow();
  ship.quaternion.copy(shipQ);
  lamp.position.copy(ship.position);
  lamp.quaternion.copy(shipQ);
  updateTrail(myTrail, shipPos, shipQ);
  updateSpeedFx(dt);
  updateAudio();
  updateTraffic(dt);
  camera.updateMatrixWorld();
  updatePeers();
  farGroup.position.copy(camPos).negate();
  camera.updateMatrixWorld();
  updateTiles();
  updateGsv();
  updatePorts();
  updateWay();
  updateMoon();
  updateTowns();
  updateShrubs();
  updateBuildings();
  if (mapOpen) drawMap(dt);
  else updateTape();
  if (relayReady && landing.classList.contains('loading') && ++loadFrames > 3) {
    landing.classList.remove('loading');
    if (!joinName.hidden) joinName.focus();
  }

  frames++;
  const now = performance.now();
  if (now - fpsT >= 500) {
    const fps = frames * 1000 / (now - fpsT), top = Math.min(devicePixelRatio, Q.maxRes), floor = Math.min(Q.minRes, top);
    if (now > 3000) {   // the first seconds are shader compiles
      // Slow: drop terrain detail (down to half a step under the preset) before resolution, which shows
      // as grain. Fast: get resolution back first, then the detail.
      const lodFloor = Math.max(1, Q.lod - 0.5);
      if (fps < 45) {
        if (lodDetail > lodFloor) lodDetail = Math.max(lodFloor, lodDetail - 0.25);
        else if (res > floor) renderer.setPixelRatio(res = Math.max(floor, res * 0.85));
      } else if (fps > 57) {
        if (res < top) renderer.setPixelRatio(res = Math.min(top, res * 1.1));
        else if (lodDetail < Q.lod) lodDetail = Math.min(Q.lod, lodDetail + 0.25);
      }
      lodInput.value = lodLabel.textContent = lodDetail;
    }
    if (now > autoPickAt) {
      autoPickAt = Infinity;
      qName = fps < 40 ? 'low' : res >= top && fps > 57 ? 'high' : 'medium';
      try { localStorage.setItem('qualityAuto', qName); } catch {}
      applyQuality(qName);
    }
    const qLabel = Object.keys(QUALITY).find(k => QUALITY[k] === Q);
    fpsEl.textContent = `${Math.round(fps)} fps · ${(renderer.info.render.triangles / 1e6).toFixed(2)}M tris · res ${res.toFixed(2)}× · ${qLabel}${autoPickAt < Infinity ? ' (testing)' : ''}`;
    const capped = keys.has('KeyW') && speedCap() < SHIP_MAX && shipSpeed > 0.97 * speedCap();   // throttling into the height limit
    flightEl.innerHTML = mode === 'ship' ? `<b>${fmtSpeed(shipSpeed)}</b>${capped ? ' <span>· climb to go faster</span>' : ''}` : '';
    statsEl.innerHTML = `${tileCount} tiles${deckCount ? ` + ${deckCount} deck` : ''}, deepest level ${deepest}<br>` +
      `finest spacing ${(TILE0 / 2 ** deepest / GRID).toFixed(3)} m<br>${shrubMesh.count} shrubs, ${bMeshes.terrace.count + bMeshes.tower.count + bMeshes.dome.count} buildings, ${bMeshes.tree.count} trees, ${nearTowns.length} settlements near`;
    frames = 0; fpsT = now;
  }
  renderer.render(scene, camera);   // after any resolution change, which clears the canvas
});
</script>
</body>
</html>
