name = "culture-orbital"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "orbital.tdelange.com", custom_domain = true }]

# Leave run_worker_first unset: page loads then come straight from the assets and are free.
[assets]
directory = "public"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
